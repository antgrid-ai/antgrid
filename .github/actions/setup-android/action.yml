name: Setup Android toolchain
description: >-
  Java + Flutter + Bun + Rust + NDK. Shared by ci-android.yml and
  deploy-android.yml so the toolchain (and its version pins) live in ONE place.
  Caches the Flutter SDK, the cargo registry, Gradle home, and the Bun install
  cache.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: '3.47.1'
        cache: true                      # cache the Flutter SDK between runs

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3'

    - name: Cache Bun install cache
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    # super_clipboard -> super_native_extensions compiles Rust during the release
    # AAB build. Its cargokit installs the toolchain targets it needs itself, so
    # none are declared here — but it will NOT install rustup (a missing one is a
    # hard RustupNotFoundException), so rustup must already exist.
    - uses: dtolnay/rust-toolchain@stable

    # Preserves ~/.cargo so super_native_extensions doesn't re-fetch the crate
    # index and its dependencies on every cold run.
    - uses: Swatinem/rust-cache@v2
      with:
        key: android

    # Caches ~/.gradle (wrapper dists + resolved deps) so Flutter's Gradle build
    # doesn't re-download the Android dependency graph each run.
    - uses: gradle/actions/setup-gradle@v5

    # Present only to supply llvm-readelf to both workflows' 16 KB alignment
    # gate, which resolves it under $ANDROID_NDK_HOME — nothing in CI links
    # Android native code with this NDK, so the r28 pin is not load-bearing and
    # the symlink below is the whole point of the step. Not cached: the extracted
    # NDK is multi-GB and would evict the higher-value Gradle/Rust/Flutter caches
    # under the 10 GB repo budget.
    - name: Install NDK r28
      shell: bash
      run: |
        # Often already in the runner image — install only if absent. `yes` keeps
        # writing after sdkmanager is satisfied and exits 0, so the pipe breaks and
        # `yes` returns non-zero; under the step's default `pipefail` that would
        # fail the step despite a clean install. Drop pipefail for the pipe so only
        # sdkmanager's own exit status counts.
        if [ ! -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358" ]; then
          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          set -o pipefail
        fi
        ln -sf "$ANDROID_SDK_ROOT/ndk/28.2.13676358" "$ANDROID_NDK_HOME"

    # Warms the pub cache — including the git dependency_overrides, whose clones
    # are the slowest part of a cold resolve — before analyze/test/build.
    - name: Flutter pub get
      working-directory: app
      shell: bash
      run: flutter pub get
