name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe where Antgrid falls short today, and what you were trying to do when you hit it. Knowing the problem lets us find the right fix, even if it ends up different from what you propose.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you imagine this working? Rough sketches are fine. Say which component it would live in if you have a view.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, or workarounds you've tried — including ones that didn't work, and why.
    validations:
      required: false
