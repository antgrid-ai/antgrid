name: Build — ghostty-vt iOS prebuilt

# Regenerates the libghostty-vt.dylib for iOS device and uploads it as an
# artifact. Run this manually, download the artifact, and commit it to
# app/.prebuilt/ios-arm64/ (see scripts/build-ghostty-ios.sh for the why).
#
# Runs on any macOS image: the script downloads the upstream release asset and
# restamps its minos, so there is no Zig and no SDK constraint. It used to be
# pinned to macos-15 because Zig 0.15.2's linker cannot link against the
# macOS 26 SDK; that relink is no longer needed (ghostty_vte-v0.1.4 ships an
# ld64-linked asset). The artifact stays committed regardless, so the deploy
# runner never fetches or builds it.

on:
  workflow_dispatch:
    inputs:
      vte_release_tag:
        description: ghostty_vte release to take the device asset from (must match the vendored bindings' ABI — the script verifies this)
        required: false
        default: ghostty_vte-v0.1.4
      expected_payload_sha256:
        description: sha256 the fork's native_prebuilt.lock.yaml records for ios-arm64 (leave blank to use the script default)
        required: false
        default: ''
      ios_min:
        description: Minimum iOS version stamped into the dylib (must match Flutter's native-asset framework MinimumOSVersion — see script; ITMS-90208)
        required: false
        default: '13.0'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # The script's ABI check compares the dylib's exports against the resolved
      # ghostty_vte bindings, so it needs a pub resolution to find them. Without
      # this it degrades to a warning and the drift it exists to catch slips past.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'   # keep in lockstep with deploy-ios
          cache: true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build compliant libghostty-vt.dylib
        env:
          VTE_RELEASE_TAG: ${{ inputs.vte_release_tag }}
          IOS_MIN: ${{ inputs.ios_min }}
        run: |
          if [ -n "${{ inputs.expected_payload_sha256 }}" ]; then
            export EXPECTED_PAYLOAD_SHA256='${{ inputs.expected_payload_sha256 }}'
          fi
          bash scripts/build-ghostty-ios.sh

      - uses: actions/upload-artifact@v7
        with:
          name: libghostty-vt-ios-arm64
          path: app/.prebuilt/ios-arm64/libghostty-vt.dylib
          if-no-files-found: error
          retention-days: 7
