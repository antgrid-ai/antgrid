name: Infra — OpenTofu (Azure VM)

# Provisions/updates the VM via OpenTofu. Runs RARELY (infra changes), separate
# from the per-push app rollout (deploy.yml). State lives in Azure Blob.
#
#   PR -> main (touching infra/tofu/**)        -> tofu plan for prod
#   PR -> development (touching infra/tofu/**)  -> tofu plan for staging
#   Manual dispatch                            -> plan, or apply, against the chosen env
#
# The PR target branch picks the environment (main is the production branch,
# development is staging), so a prod-bound PR never spends a runner planning
# staging and vice-versa. Each environment is an OpenTofu workspace (prod |
# staging) with isolated state
# in the same Azure Blob backend. Auth is OIDC (no stored client secret).
# One-time setup (infra/bootstrap/bootstrap.sh does all of this): create an Azure
# AD app registration / federated credential for this repo and grant it
# Contributor on the subscription, then set the repo variables/secrets below:
#   Secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#              TF_STATE_PASSPHRASE (state encryption — 32+ chars, set ONCE and
#              reused; an unset/changed value fails every job closed).
#   Variables: TFSTATE_RG, TFSTATE_SA, TFSTATE_CONTAINER.
# Authorized SSH public keys are NOT wired here — they're committed in
# infra/tofu/ssh_keys.auto.tfvars (public keys aren't secret) and auto-loaded.
#
# NOTE: state encryption is enforced. If a workspace's state was created BEFORE
# encryption was enabled, it's plaintext and will be rejected here — delete the
# empty/unencrypted state blob (nothing applied yet) or do the one-time migration
# in infra/tofu/README.md "State encryption" before the first run.

on:
  pull_request:
    branches: [main, development]
    paths: ['infra/tofu/**', '.github/workflows/infra.yml']
  workflow_dispatch:
    inputs:
      action:
        description: 'plan or apply'
        type: choice
        options: [plan, apply]
        default: plan
      environment:
        description: 'environment to plan/apply on this manual dispatch'
        type: choice
        options: [prod, staging]
        default: staging

permissions:
  id-token: write      # OIDC token for azure/login
  contents: read
  pull-requests: write # post the plan back onto the PR

env:
  ARM_USE_OIDC: 'true'
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  # ssh_public_keys is supplied by the committed infra/tofu/ssh_keys.auto.tfvars
  # (auto-loaded by OpenTofu) — no env wiring needed; public keys aren't secret.
  # State encryption passphrase (postgres.tf puts the DB admin password in state).
  # Same value must be used locally — see infra/tofu/README.md "State encryption".
  # Must be identical across prod & staging (one backend, one passphrase).
  TF_ENCRYPTION: 'key_provider "pbkdf2" "state" { passphrase = "${{ secrets.TF_STATE_PASSPHRASE }}" }'

jobs:
  # Resolve which environment(s) this run covers, as a JSON array the matrix
  # expands. PR target branch decides (main -> prod, development -> staging); a
  # manual dispatch runs only the chosen environment. A PR to any other base
  # yields [] and the tofu job is skipped.
  setup:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.pick.outputs.environments }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            envs='["${{ inputs.environment }}"]'
          elif [ "${{ github.base_ref }}" = "main" ]; then
            envs='["prod"]'
          elif [ "${{ github.base_ref }}" = "development" ]; then
            envs='["staging"]'
          else
            envs='[]'
          fi
          echo "environments=$envs" >> "$GITHUB_OUTPUT"

  tofu:
    needs: setup
    if: needs.setup.outputs.environments != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.setup.outputs.environments) }}
    # Per-environment state means prod and staging never contend; serialize each
    # environment with itself so two runs can't fight the same workspace lock.
    concurrency:
      group: infra-tofu-${{ matrix.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/tofu
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      - name: Init
        run: |
          tofu init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=antgrid.tfstate" \
            -backend-config="use_oidc=true"

      # Select (creating if needed) this leg's environment workspace. State is
      # isolated per workspace inside the shared backend.
      - name: Select workspace
        run: tofu workspace select -or-create "${{ matrix.environment }}"

      - name: Format check (advisory)
        continue-on-error: true
        run: tofu fmt -check -recursive

      - name: Validate
        run: tofu validate

      - name: Plan
        id: plan
        run: tofu plan -no-color -input=false -out=tf.plan | tee plan.txt

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/tofu/plan.txt', 'utf8');
            const body = `#### OpenTofu plan — \`${{ matrix.environment }}\` 📖\n\`\`\`\n${plan.slice(0, 60000)}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # Apply only the dispatched environment (the other matrix leg still plans).
      - name: Apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && matrix.environment == inputs.environment
        run: tofu apply -input=false -auto-approve tf.plan
