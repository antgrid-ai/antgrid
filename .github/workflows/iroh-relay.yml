name: Iroh relay verification

on:
  pull_request:
    paths:
      - 'iroh-relay/**'
      - '.github/workflows/iroh-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.98.1'
      - name: Build pinned client protocol compatibility probe
        working-directory: iroh-relay
        run: cargo build --locked --manifest-path compat-client/Cargo.toml
      - name: Test admission, dispatch fences and client compatibility
        working-directory: iroh-relay
        env:
          ANTGRID_LEGACY_RELAY_CLIENT: ${{ github.workspace }}/iroh-relay/compat-client/target/debug/antgrid-relay-compat-client
        run: cargo test --locked
      - name: Build relay container
        run: docker build -t antgrid-iroh-relay:verification iroh-relay
