name: Deploy — Android (Play Store)

# Publishes a signed release AAB to the Play Store internal track once a night,
# if anything shipped that day. PR-time analyze/test/build lives in
# ci-android.yml, so this never runs on PRs — one Android toolchain setup per PR
# instead of two.
# Nightly rather than per-push, in lockstep with deploy-ios.yml: an internal
# track that gains four builds a day is noise, and one publish per shipping day
# is the cadence testers actually consume. See that file for the reasoning.
#
# `schedule` only ever fires on the DEFAULT branch, so this is development ->
# internal track (promote to alpha/beta/production by hand from the Play
# Console). Merging to main publishes nothing on its own; shipping any other
# branch is a manual workflow_dispatch run from it.

on:
  # Ten minutes after deploy-ios.yml so the two don't contend for the same
  # scheduler slot; off the hour for the same queueing reason documented there.
  # Both stamp versionName from the clock, and a ten-minute offset is far from
  # any UTC day boundary, so the two stores stay on the same day number.
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-android-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Restores the `paths:` filter the push trigger provided — a scheduled event
  # carries none. See .github/actions/deploy-gate.
  gate:
    if: vars.RELEASE_REPO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@v7
      - id: gate
        uses: ./.github/actions/deploy-gate
        with:
          workflow: deploy-android.yml
          paths: app packages .github/workflows/deploy-android.yml .github/actions/setup-android
          token: ${{ github.token }}

  deploy:
    needs: gate
    # Only an explicit 'false' stops a build — see deploy-ios.yml for why a
    # dead gate job must still deploy.
    # RELEASE_REPO is repeated here on purpose: a SKIPPED `gate` leaves
    # needs.gate.outputs.go empty, which satisfies `!= 'false'`, so gating the
    # gate alone would still deploy.
    if: ${{ vars.RELEASE_REPO == 'true' && !cancelled() && needs.gate.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_NDK_HOME: ${{ github.workspace }}/ndk-r28
    # Keyed on the EVENT, not the branch. The nightly IS the release build — it
    # is what reaches the Play internal track and what testers install,
    # so it carries production's SENTRY_DSN; a manual dispatch is an ad-hoc
    # build and gets staging's. A ref_name test cannot express this: `schedule`
    # only ever fires on the default branch, so it could never select production.
    environment: ${{ github.event_name == 'schedule' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v7

      # The release AAB builds super_native_extensions (Rust) for 4 ABIs plus
      # Flutter/pdfium .so files; native-lib stripping exhausted the runner's
      # ~14 GB disk ("No space left on device"). Reclaim preinstalled toolchains
      # this build never uses — deliberately NOT touching the Android SDK/NDK,
      # Java, or the Flutter toolcache (hostedtoolcache) that setup-android needs.
      # Keep in lockstep with ci-android.yml.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          docker image ls -aq | xargs -r docker rmi -f || true
          df -h /

      - uses: ./.github/actions/setup-android

      # Write key.properties so build.gradle.kts picks up the upload keystore.
      # The keystore file is base64-encoded in the secret to survive the env var.
      - name: Set up release signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/android/upload-keystore.jks
          cat > app/android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF

      # versionName is stamped, not read from pubspec — see the `version` job in
      # build-desktop.yml for the format. VERSION_MAJOR must match the env of the
      # same name there; nothing enforces it across workflow files, so bump both
      # together or desktop and mobile will report the same release under
      # different majors.
      - name: Stamp version
        id: version
        env:
          VERSION_MAJOR: '1'
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
        run: |
          set -euo pipefail

          # run_number is scoped to ONE workflow in ONE repository and restarts
          # at 1 in a fresh repo, but the stores remember every build number
          # they have ever ACCEPTED for the product -- internal-track and
          # TestFlight uploads included, so "not released publicly yet" does not
          # reset it. Moving repos therefore walks the counter back under
          # numbers already taken and every upload is rejected. The offset lifts
          # the new repo's sequence clear of the old one's high-water mark.
          #
          # Unset means 0, and unset is correct on the repo that owns the
          # original counter -- that is what keeps both repos from consuming the
          # same offset range while publishing still runs from the old one.
          offset="${BUILD_NUMBER_OFFSET:-0}"
          case "$offset" in
            *[!0-9]*|'') echo "::error::BUILD_NUMBER_OFFSET must be a non-negative integer, got '$offset'"; exit 1 ;;
          esac
          build_number=$(( GITHUB_RUN_NUMBER + offset ))

          {
            echo "name=${VERSION_MAJOR}.$(( $(date -u +%s) / 86400 )).${build_number}"
            echo "build_number=${build_number}"
            echo "sha=${GITHUB_SHA:0:6}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # Override pubspec's static +1 versionCode: Play rejects any upload whose
      # versionCode was already used, and every CI build would otherwise stamp 1.
      # The stamped build number is monotonic, so each publish gets a fresh,
      # increasing code. It must stay THIS workflow's own run_number plus the
      # repo-wide offset — sourcing the counter from another workflow, or
      # dropping the offset, restarts the sequence below codes Play has already
      # seen and every upload is rejected.
      - name: Build signed release AAB
        working-directory: app
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.build_number }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=APP_VERSION=${{ steps.version.outputs.name }} \
            --dart-define=GIT_SHA=${{ steps.version.outputs.sha }} \
            --dart-define=BUILD_TIME=${{ steps.version.outputs.built }}

      - name: Verify 16 KB alignment
        run: |
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          unzip -o app/build/app/outputs/bundle/release/app-release.aab 'base/lib/*/*.so' -d /tmp/aab
          fail=0
          for abi in arm64-v8a x86_64; do
            for so in /tmp/aab/base/lib/$abi/*.so; do
              align=$("$READELF" -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | tail -1)
              if [ "$((align))" -lt 16384 ]; then
                echo "MISALIGNED: $abi/$(basename "$so") ($align)"; fail=1
              fi
            done
          done
          [ "$fail" = 0 ] && echo "All 64-bit libs >= 16 KB alignment ✓"
          exit $fail

      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ai.radhaai.antgrid
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
