name: Contribution policy

# Refuses outside patches to the Elastic-2.0 side of the licence boundary.
#
# GitHub ToS D.6 licenses a contribution under "the same terms" as the
# repository's licence notice, and GitHub resolves that to ONE licence:
# MPL-2.0, detected from the root LICENSE.md. A contribution to relay/ or web/
# would therefore arrive under MPL-2.0 and land in an Elastic-2.0 file, carrying
# MPL source-availability obligations into the two services ELv2 exists to
# protect — and neither licence lets us relicense it afterwards.
# packages/antgrid-wire is the same trap from the other side: both services
# import it, so a contribution there is MPL-2.0 permanently.
#
# LICENSING.md and CONTRIBUTING.md carry the reasoning; .github/CODEOWNERS
# routes the same paths to maintainer review. This is the half that does not
# depend on anyone remembering.
#
# NOT paths-filtered on purpose: a required check that is skipped never reports,
# and a PR waiting on a check that will never run cannot be merged. This runs on
# every pull request and decides inside.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: contribution-policy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  licence-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: the API answers which files the PR touches without one, and
      # it is authoritative where a local diff would depend on picking the right
      # merge base.
      - name: Outside patches must not touch the ELv2 boundary
        env:
          GH_TOKEN: ${{ github.token }}
          # Pushing a branch to this repository requires write access, so a PR
          # whose head branch lives here cannot be an outside patch. This is the
          # load-bearing check.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          # Only a fallback, for a maintainer working from a fork. OWNER /
          # MEMBER / COLLABORATOR are the inside set and everything else —
          # CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR, FIRST_TIMER, MANNEQUIN, NONE —
          # reads as outside. It is a DISPLAY attribute, not an authorization
          # one: it answered CONTRIBUTOR for the repository owner on the first
          # PR this ever ran against, which is why it cannot be the only gate.
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Empty when the head fork has since been deleted; that falls through
          # to the checks below rather than passing.
          if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            echo "Head branch is in $BASE_REPO — author has write access, nothing to enforce."
            exit 0
          fi

          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "Author association is $ASSOCIATION — maintainer, nothing to enforce."
              exit 0
              ;;
          esac

          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
            --paginate --jq '.[].filename')
          blocked=$(printf '%s\n' "$files" \
            | grep -E '^(relay/|web/|packages/antgrid-wire/)' || true)

          if [ -z "$blocked" ]; then
            echo "No files under the ELv2 boundary — nothing to enforce."
            exit 0
          fi

          echo "::error::This PR changes Elastic-2.0 licensed paths, which we cannot accept from outside contributors. See CONTRIBUTING.md — it is a licensing constraint, not a judgement on the change. Please open an issue instead."
          printf '%s\n' "$blocked" | awk 'NR<=20'
          exit 1
