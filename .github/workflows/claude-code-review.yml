name: Claude Code Review

# Mention-triggered only. Deliberately NOT on `pull_request` events — a push
# should never spend a review run; ask for one by commenting `/code-review`.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-review:
    # The trigger phrase must never contain `@claude`: claude.yml matches that
    # as a substring, so a shared token makes both workflows answer at once.
    if: |
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '/code-review')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '/code-review'))

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # issue_comment carries the PR as `issue`; review comments carry it as
          # `pull_request`. Exactly one is set, so `||` picks the live one.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.issue.number || github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
