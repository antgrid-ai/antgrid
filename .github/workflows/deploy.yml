name: Deploy — relay + web (VM / blue-green)

# Builds both images, pushes to GHCR, then runs the blue-green flip on the VM.
# Infra (the VMs) is provisioned separately and rarely via OpenTofu
# (infra/tofu, workflow infra.yml). This workflow is the per-push rollout layer only.
#
# Branch -> environment:
#   main         -> production  (app.antgrid.ai / relay.antgrid.ai)
#   development  -> staging      (app.staging.antgrid.ai / relay.staging.antgrid.ai)
# The GitHub Environment supplies only the env-scoped SSH_PRIVATE_KEY secret. The
# SSH host (app.$DOMAIN), SSH_USER, and the deploy DOMAIN are all derived in this
# file from the branch — not secret, and not tied to the VM's (changeable) IP.

on:
  push:
    branches: [main, development]
    paths:
      - 'relay/**'
      - 'web/**'
      - 'deploy/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Serialize per branch so prod and staging deploys never block each other, but a
# given environment still flips one deploy at a time.
concurrency:
  group: deploy-vm-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Derived, never hardcoded: GHCR packages are org-scoped and do NOT follow a
  # repo transfer, so a literal owner here goes stale the moment the repo moves
  # and every push 403s against an org this token has no write on. GHCR requires
  # a lowercase path — safe while the org login is already lowercase.
  OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  # Both images are independent — build them concurrently via a matrix. The image
  # tag is just the short SHA (computed deterministically in the deploy job too).
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, relay]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Short SHA = the precise tag the deploy pulls. The env name (prod/staging)
      # is a per-environment moving tag — kept separate so main and development
      # never clobber each other's "latest".
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: envname
        run: echo "env=${{ github.ref_name == 'main' && 'prod' || 'staging' }}" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/antgrid-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ env.OWNER }}/antgrid-${{ matrix.service }}:${{ steps.envname.outputs.env }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ steps.envname.outputs.env }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ steps.envname.outputs.env }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # main -> production, anything else (development) -> staging. The Environment
    # supplies the env-scoped SSH_PRIVATE_KEY secret, and can carry an approval
    # gate on production.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    # Single source of truth for this env's domain. The SSH host (app.$DOMAIN) and
    # deploy.sh's DOMAIN both derive from it, so they can't drift.
    env:
      DOMAIN: ${{ github.ref_name == 'main' && 'antgrid.ai' || 'staging.antgrid.ai' }}
    steps:
      - uses: actions/checkout@v7

      # Image tag = short SHA. Computed here independently of the matrix build job
      # (matrix jobs don't expose a single clean output).
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Sync the rollout files (compose, Caddyfile, deploy.sh) to the VM. The
      # host .env is never shipped — it's placed once during bootstrap.
      - name: Copy deploy/ to VM
        uses: appleboy/scp-action@v1.0.0
        with:
          # SSH by DNS name (app.$DOMAIN -> VM), so a VM rebuild (new IP) needs only
          # a DNS update, no secret. The DNS record MUST exist and resolve to the
          # origin IP before the first deploy. Set the optional SSH_HOST secret to a
          # raw IP to override — for first-boot-before-DNS or a proxied app host.
          host: ${{ secrets.SSH_HOST || format('app.{0}', env.DOMAIN) }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/*"
          target: "/srv/antgrid"
          strip_components: 1
          overwrite: true

      - name: Blue-green flip
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          # Ephemeral GHCR creds so the VM can pull PRIVATE images without a stored
          # PAT. GITHUB_TOKEN is scoped to this repo (packages:write granted above)
          # and expires when the job ends.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # compose.app.yml has no GitHub context to derive the owner from, so it
          # is passed down rather than duplicated as a second literal.
          GHCR_OWNER: ${{ github.repository_owner }}
        with:
          # See the scp step above for the host/SSH_HOST-override rationale.
          host: ${{ secrets.SSH_HOST || format('app.{0}', env.DOMAIN) }}
          # Same admin user across envs (infra/tofu admin_username default). Not
          # secret, so a literal rather than an Environment secret.
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # DOMAIN is the job-level env above; deploy.sh reads it to build app.$DOMAIN.
          envs: IMAGE_TAG,DOMAIN,GHCR_USER,GHCR_TOKEN,GHCR_OWNER
          script: |
            set -e
            cd /srv/antgrid
            # Pull private images with the workflow's short-lived token, in an
            # ISOLATED docker config dir so we never touch (or clobber) any
            # persistent login in the operator's ~/.docker. Removed on exit; no
            # global `docker logout` that could wipe a manual deploy login.
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            chmod +x deploy.sh
            IMAGE_TAG="$IMAGE_TAG" DOMAIN="$DOMAIN" GHCR_OWNER="$GHCR_OWNER" ./deploy.sh
