name: Build — desktop (macOS / Windows / Linux)

# Desktop builds for macOS + Windows + Linux. Two entry points:
#   - Push a v* tag        -> builds all platforms (release). macOS + Linux are
#                             published as a GitHub Release on the PUBLIC repo
#                             antgrid-ai/antgrid-releases; Windows ships to
#                             the Microsoft Store (MSIX) instead of a direct
#                             download. The site links releases/latest/download/
#                             <asset> — the mac/linux asset filenames
#                             (antgrid-macos.dmg / antgrid-linux.AppImage) are
#                             load-bearing, never rename them. Same for
#                             appcast.xml: the macOS app's Sparkle updater
#                             fetches releases/latest/download/appcast.xml
#                             (see app/lib/update/macos_sparkle_update_service.dart).
#                             And antgrid-linux.AppImage.zsync: the update
#                             information embedded in every shipped AppImage
#                             points at it, so a future in-app delta updater
#                             (AppImageUpdate/zsync2) can patch installs in
#                             place — publish it with every release.
#   - Dispatch release=true -> the normal way to ship. Stamps the version from
#                             the clock (see the `version` job), pushes the tag,
#                             and takes the same publish path as a v* tag.
#   - Manual dispatch      -> builds selected platform/mode, artifacts only
#                             (no publish). Run from the Actions tab or
#                             `gh workflow run build-desktop.yml`.
#
# Signing is OPTIONAL and auto-detected: with no signing secrets set the builds
# are UNSIGNED (fine for sharing with people who can bypass Gatekeeper / SmartScreen).
# Add the secrets listed under each "Code sign" step later to get signed +
# (macOS) notarized output with no workflow changes.

on:
  # A v* tag builds ALL platforms in RELEASE mode, publishes macOS + Linux as a
  # GitHub Release on the public antgrid-releases repo, and ships Windows to the
  # Microsoft Store (inputs are empty on push events; every `inputs.*` consumer
  # below defaults accordingly).
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform(s) to build
        type: choice
        default: all
        # `both` is a legacy alias kept for muscle memory — it means macOS +
        # Windows only (the pre-Linux set). `all` is the everything build.
        options: [all, both, macos, windows, linux]
      build_mode:
        description: Flutter build mode
        type: choice
        default: release
        options: [release, profile, debug]
      release:
        description: 'Cut a release: stamp the version, tag it, and publish'
        type: boolean
        default: false

concurrency:
  # Distinct (platform, mode) dispatches on the same branch must not cancel each
  # other — only a newer dispatch of the SAME config supersedes an in-flight one.
  # A release carries `release` in the key and opts out of cancellation entirely,
  # so an ordinary dispatch can never kill a publish that is already uploading.
  group: build-desktop-${{ github.ref }}-${{ inputs.platform }}-${{ inputs.build_mode }}-${{ inputs.release }}
  cancel-in-progress: ${{ !inputs.release }}

env:
  # Keep in lockstep with .github/actions/setup-android.
  #
  # The SDK install is deliberately NOT cached here (no `cache: true` on
  # flutter-action) — only the pub cache is. A repo gets 10 GB of Actions cache
  # with LRU eviction, and three copies of the SDK were 5.5 GB of it while buying
  # very little: a hit restores ~2 GB in ~50s against a ~2 min cold install, and
  # on Windows the post-step save alone cost ~3 min. Worse, the Windows entry
  # could never hit at all — build-desktop runs only from a v* tag or a dispatch,
  # and a cache is readable only from its own ref or the DEFAULT branch, so every
  # release wrote 1.8 GB into a scope the next release could not read. The pub
  # cache is the opposite trade (~158 MB, ~12s) and is worth its bytes.
  FLUTTER_VERSION: '3.47.0'
  LICENSE_API_URL: 'https://app.antgrid.ai'
  # The only hand-maintained part of the version. Bump for a deliberate product
  # major; the rest of the string is stamped from the clock and the run counter.
  VERSION_MAJOR: '1'

jobs:
  # Single source of truth for the version string every downstream job stamps.
  # CalVer-ish: <major>.<days since Unix epoch>.<run number>, e.g. 1.20662.412.
  #   - days-since-epoch is UTC integer division, so it has no leading-zero or
  #     DST hazard and increases exactly once a day, forever.
  #   - run_number discriminates several releases within the same day.
  # The commit and the build time are NOT encoded here (a hex sha is not a legal
  # version component in semver, App Store, or MSIX) — they ride alongside as
  # dart-defines.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      name: ${{ steps.compute.outputs.name }}
      build_name: ${{ steps.compute.outputs.build_name }}
      msix: ${{ steps.compute.outputs.msix }}
      tag: ${{ steps.compute.outputs.tag }}
      sha: ${{ steps.compute.outputs.sha }}
      built: ${{ steps.compute.outputs.built }}
    steps:
      - uses: actions/checkout@v7

      - id: compute
        env:
          IS_RELEASE: ${{ inputs.release }}
          MODE: ${{ inputs.build_mode || 'release' }}
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A hand-pushed v* tag stays authoritative: the tag IS the version.
            name="${GITHUB_REF_NAME#v}"
          else
            if [ "$IS_RELEASE" = true ] && [ "$MODE" != release ]; then
              echo "::error::release=true needs build_mode=release — the stores reject debug/profile packages"
              exit 1
            fi
            # publish needs both macos and linux; a narrower platform would skip
            # it silently and burn a version number on nothing.
            if [ "$IS_RELEASE" = true ] && [ "$PLATFORM" != all ]; then
              echo "::error::release=true needs platform=all — publish requires the macOS and Linux artifacts"
              exit 1
            fi
            name="${VERSION_MAJOR}.$(( $(date -u +%s) / 86400 )).${GITHUB_RUN_NUMBER}"
          fi

          # MSIX takes four 16-bit integers with the revision pinned to 0, and it
          # cannot express a pre-release suffix — validate here rather than
          # discovering it 20 minutes into the Windows job.
          core="${name%%-*}"
          case "$core" in
            *.*.*.*|*[!0-9.]*|.*|*.) echo "::error::version '$name' is not three integer components"; exit 1 ;;
          esac
          IFS=. read -r a b c <<< "$core"
          for part in "$a" "$b" "$c"; do
            [ -n "$part" ] || { echo "::error::version '$name' is not three integer components"; exit 1; }
            [ "$part" -le 65535 ] || { echo "::error::component $part exceeds the MSIX 65535 ceiling"; exit 1; }
          done

          # build_name feeds --build-name, which every desktop platform splits
          # into three integers (Windows expands them straight into Runner.rc's
          # VERSION_AS_NUMBER, macOS into CFBundleShortVersionString) — so it
          # gets the numeric core, never a `-beta.1` suffix. `name` keeps the
          # full string for the tag, the release title, and APP_VERSION.
          {
            echo "name=$name"
            echo "build_name=$core"
            echo "msix=$core.0"
            echo "tag=v$name"
            echo "sha=${GITHUB_SHA:0:6}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # Tag the commit that produced the release. Pushing with GITHUB_TOKEN
      # deliberately does NOT re-trigger this workflow's `push: tags` path
      # (GitHub's recursion guard) — this same run already builds and publishes,
      # so a second run would be a duplicate, not a missing step.
      #
      # Idempotent because run_number is stable across re-runs (only run_attempt
      # increments): re-running a release that died in a later job recomputes the
      # same tag, and a hard failure here would strand the release with the tag
      # already pushed and no way to finish it.
      - name: Tag the release
        if: ${{ github.ref_type != 'tag' && inputs.release }}
        env:
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already on origin — re-run of an earlier attempt, leaving it in place"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Antgrid $TAG"
          git push origin "$TAG"

  macos:
    # Empty inputs = tag push = build everything.
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'both' || inputs.platform == 'macos' }}
    needs: [version]
    runs-on: macos-15
    # This job normally finishes in ~9 minutes. One hung run sat here for 4
    # hours before failing and cost more billable minutes than every PR that
    # month combined — macOS bills at 10x, and GitHub's default cap is 6 hours.
    # Notarization is the usual suspect: `xcrun notarytool ... --wait` blocks on
    # an Apple-side queue with no deadline of its own.
    timeout-minutes: 45
    env:
      # Tag pushes carry no inputs — default to a release build.
      BUILD_MODE: ${{ inputs.build_mode || 'release' }}
      # Flutter's product subfolder for the selected mode, computed once so the
      # sign and package steps can never disagree on which bundle they handle.
      DEST: ${{ (inputs.build_mode == '' || inputs.build_mode == 'release') && 'Release' || inputs.build_mode == 'profile' && 'Profile' || 'Debug' }}
      # Lifted to a job env so the signing step can gate on it: the `secrets`
      # context is not reliably readable inside a step-level `if`, but `env` is.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v7

      # `cache: true` is intentionally absent — it caches the SDK, not just pub,
      # and that is a losing trade against the 10 GB budget (see FLUTTER_VERSION
      # above). The pub cache below is kept explicitly.

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          # Deliberately NO restore-keys prefix (unlike setup-android's copy):
          # actions/cache re-saves the directory as it stands, so a partial
          # restore compounds into a superset and bun never prunes the versions
          # a lockfile bump dropped.
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # The half of flutter-action's caching that is worth its bytes. Flutter
      # puts PUB_CACHE at %LOCALAPPDATA%\Pub\Cache on Windows and ~/.pub-cache
      # everywhere else; both are the SDK's own defaults, so this stays correct
      # whether or not flutter-action exports PUB_CACHE itself.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/Pub/Cache' || '~/.pub-cache' }}
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Install JS workspace deps
        # --ignore-scripts skips the root/web postinstall (Prisma client codegen
        # for the web service) — the desktop build never touches Postgres or web.
        run: bun install --ignore-scripts

      - name: Build bridge (universal macOS binary)
        run: |
          set -euo pipefail
          mkdir -p bridge/dist
          bun build bridge/src/index.ts --compile \
            --target bun-darwin-arm64 \
            --outfile bridge/dist/antgrid-bridge-arm64 \
            --define 'process.env.LICENSE_API_URL="${{ env.LICENSE_API_URL }}"' \
            --define 'process.env.ANTGRID_BRIDGE_COMPILED="1"'
          bun build bridge/src/index.ts --compile \
            --target bun-darwin-x64 \
            --outfile bridge/dist/antgrid-bridge-x64 \
            --define 'process.env.LICENSE_API_URL="${{ env.LICENSE_API_URL }}"' \
            --define 'process.env.ANTGRID_BRIDGE_COMPILED="1"'
          lipo -create -output bridge/dist/antgrid-bridge \
            bridge/dist/antgrid-bridge-arm64 \
            bridge/dist/antgrid-bridge-x64

      - name: Smoke test compiled bridge hook
        run: bun run bridge/scripts/smoke-hook-binary.ts bridge/dist/antgrid-bridge

      - name: Build macOS app
        id: build
        working-directory: app
        run: |
          flutter build macos --${{ env.BUILD_MODE }} \
            --build-name=${{ needs.version.outputs.build_name }} \
            --build-number=${{ github.run_number }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=APP_VERSION=${{ needs.version.outputs.name }} \
            --dart-define=GIT_SHA=${{ needs.version.outputs.sha }} \
            --dart-define=BUILD_TIME=${{ needs.version.outputs.built }}

      - name: Copy bridge into .app bundle
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          MACOS_BIN="app/build/macos/Build/Products/$DEST/antgrid.app/Contents/MacOS"
          cp bridge/dist/antgrid-bridge "$MACOS_BIN/antgrid-bridge"
          chmod +x "$MACOS_BIN/antgrid-bridge"

      # Signing — runs only when the Apple secrets are present AND the build is
      # `release`. debug/profile bundles carry `get-task-allow` (which notarization
      # later rejects) and need the JIT entitlement (DebugProfile.entitlements) that a
      # hardened-runtime re-sign would have to special-case; release uses the empty
      # Release.entitlements + AOT, so it is the only signable/notarizable mode.
      # Notarization is a SEPARATE step below, targeting the packaged .dmg (sign the
      # app here → package the dmg → notarize+staple the dmg).
      # Required secrets (this step):
      #   APPLE_CERTIFICATE_BASE64   base64 of a "Developer ID Application" .p12
      #   APPLE_CERTIFICATE_PASSWORD password for that .p12
      #   APPLE_SIGNING_IDENTITY     e.g. "Developer ID Application: Name (TEAMID)"
      # (the notarize step below additionally needs APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID)
      - name: Code sign (optional)
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' && env.BUILD_MODE == 'release' }}
        env:
          APP: app/build/macos/Build/Products/Release/antgrid.app
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # Import the signing cert into a throwaway keychain.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # Sign nested Mach-O inside-out, THEN the outer bundle. `--deep` is
          # unreliable for Flutter .app bundles (Apple discourages it and it can
          # leave embedded frameworks invalidly signed), so sign each explicitly.
          while IFS= read -r -d '' dylib; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$dylib"
          done < <(find "$APP/Contents/Frameworks" -name '*.dylib' -print0)
          # Sparkle (auto_updater) nests its own helpers inside the framework
          # (XPC services, Autoupdate, Updater.app). Re-sign them inside-out
          # with our identity BEFORE the outer framework seal below — the
          # framework-level codesign does not descend into nested code, and
          # notarization wants one consistent Developer ID chain.
          # --preserve-metadata=entitlements keeps Sparkle's own XPC
          # entitlements (Downloader.xpc carries network-client) intact.
          # Paths follow Sparkle 2's Versions/B layout; each is guarded so a
          # Sparkle version that drops one is skipped, not fatal.
          SPARKLE_FW="$APP/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPARKLE_FW" ]; then
            for xpc in "$SPARKLE_FW"/Versions/B/XPCServices/*.xpc; do
              [ -e "$xpc" ] && codesign --force --options runtime --timestamp \
                --preserve-metadata=entitlements --sign "$IDENTITY" "$xpc"
            done
            [ -e "$SPARKLE_FW/Versions/B/Autoupdate" ] && codesign --force --options runtime --timestamp --sign "$IDENTITY" "$SPARKLE_FW/Versions/B/Autoupdate"
            [ -e "$SPARKLE_FW/Versions/B/Updater.app" ] && codesign --force --options runtime --timestamp --sign "$IDENTITY" "$SPARKLE_FW/Versions/B/Updater.app"
          fi
          for fw in "$APP"/Contents/Frameworks/*.framework; do
            [ -e "$fw" ] && codesign --force --options runtime --timestamp --sign "$IDENTITY" "$fw"
          done
          # Sign the bundled bridge binary before the outer bundle seal, with its own
          # entitlements (the outer-app entitlement does not propagate to this separate
          # Mach-O). The bridge is a Bun `--compile` single-file executable, and needs:
          #   - JIT entitlements (allow-jit, allow-unsigned-executable-memory,
          #     disable-executable-page-protection, allow-dyld-environment-variables):
          #     Bun embeds JavaScriptCore, which needs writable-executable memory. Under
          #     Hardened Runtime the OS blocks that without these, and JSC then fails to
          #     install SharedArrayBuffer (which @anthropic-ai/claude-agent-sdk uses
          #     unguarded at module top level) -> bridge dies "SharedArrayBuffer is not
          #     defined". Bun's documented set: bun.sh/docs/bundler/executables
          #   - disable-library-validation: the binary embeds bun-pty's PTY dylib
          #     (ad-hoc/linker-signed, no Team ID) and dlopens it from a temp dir; Team-ID
          #     library validation would reject it as a foreign team and the PTY dies.
          # Keep Bridge.entitlements comment-free ASCII: codesign's AMFI plist parser is
          # strict (rejects `--` in XML comments, unlike plutil) and fails the whole sign.
          codesign --force --options runtime --timestamp \
            --entitlements app/macos/Runner/Bridge.entitlements \
            --sign "$IDENTITY" "$APP/Contents/MacOS/antgrid-bridge"
          codesign --force --options runtime --timestamp \
            --entitlements app/macos/Runner/Release.entitlements \
            --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      # Always package the DMG when the BUILD succeeded, even if the optional sign
      # step didn't run (unsigned/dispatch builds) — a good build is never discarded.
      # create-dmg lays out a drag-to-Applications window (app icon + Applications
      # alias). Signing/notarization of the dmg happens in the next step.
      - name: Package DMG
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          brew install create-dmg
          APP="app/build/macos/Build/Products/$DEST/antgrid.app"
          create-dmg \
            --volname "Antgrid" \
            --window-size 600 400 \
            --icon-size 120 \
            --icon "antgrid.app" 150 190 \
            --app-drop-link 450 190 \
            --no-internet-enable \
            "antgrid-macos.dmg" \
            "$APP"

      # Notarize + staple the DMG. Same gate as the sign step; stapling the dmg is
      # Apple's supported flow (mounting + drag-out passes Gatekeeper offline). No
      # continue-on-error: a notary/staple failure fails the job so an unstapled dmg
      # is never published as a release. Required secrets: APPLE_ID / APPLE_PASSWORD
      # (app-specific) / APPLE_TEAM_ID, plus APPLE_SIGNING_IDENTITY to sign the dmg.
      - name: Notarize + staple DMG (optional)
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' && env.BUILD_MODE == 'release' }}
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PW: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          codesign --force --timestamp --sign "$IDENTITY" "antgrid-macos.dmg"
          # --timeout is not optional on a 10x-billed runner: bare --wait polls
          # Apple's queue forever, and a stuck submission once held this job for
          # four hours. Exceeding it exits non-zero, so a slow notarization fails
          # the release loudly instead of quietly draining the month's minutes.
          #
          # 30m, not 15: Apple quotes "most requests complete in under 15
          # minutes" and has had multi-hour backlogs, so a tighter cap would
          # redden ordinary releases on a queue that was merely slow. The rest
          # of this job measures ~9.5 min, which keeps the worst case inside the
          # 45-minute job cap above — raise both together or neither.
          xcrun notarytool submit "antgrid-macos.dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_PW" --team-id "$TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple "antgrid-macos.dmg"

      # Sparkle appcast for macOS in-app updates. Release paths only —
      # published as a release asset and fetched by the app at
      # releases/latest/download/appcast.xml (so a prerelease tag's appcast is
      # inert: prereleases never move `latest`). The enclosure URL pins the
      # TAG, not latest, so an already-fetched appcast keeps resolving after
      # the next release. The gate requires an Apple-signed dmg: shipped apps
      # carry no SUPublicEDKey in Info.plist, so Developer ID is the ONLY
      # verification Sparkle can perform today — an EdDSA key alone must NOT
      # publish an appcast (installed apps would download the unsigned dmg
      # and fail verification, fleet-wide). EdDSA signing is additive on top
      # when SPARKLE_ED_PRIVATE_KEY is set; only once SUPublicEDKey ships in
      # app/macos/Runner/Info.plist may the gate accept EdDSA without Apple
      # signing. That key is a one-way door and must ship AFTER the secret is
      # already signing appcasts: an app carrying it rejects every later
      # enclosure without a valid edSignature, so from then on a lost or
      # rotated secret bricks every install's update path, not just CI.
      - name: Generate Sparkle appcast
        id: appcast
        # The release-path half must match the publish job verbatim: a
        # dispatch with release=true pushes the tag from a BRANCH ref, so
        # github.ref stays refs/heads/* and a tags-only gate would skip this
        # step on the documented way to ship — leaving publish to fail closed
        # on its own missing-appcast probe. The signing half stays because a
        # debug/profile dispatch skips signing, and an appcast generated
        # there would advertise an unsigned dmg.
        if: ${{ ((github.event_name == 'push' && github.ref_type == 'tag') || inputs.release) && steps.build.outcome == 'success' && env.APPLE_SIGNING_IDENTITY != '' && env.BUILD_MODE == 'release' }}
        env:
          # The version job's tag, not github.ref_name — on the dispatch path
          # the ref is the branch, which would point the enclosure URL and the
          # release-notes link at a tag that does not exist.
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.name }}
          BUILD: ${{ github.run_number }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          # Sparkle tools release used for sign_update only (the framework the
          # app embeds comes from the auto_updater pod, independently).
          SPARKLE_TOOLS_VERSION: 2.6.4
        run: |
          set -euo pipefail
          # The app's own detection compares the version triple, but Sparkle's
          # install compares CFBundleVersion (--build-number, i.e. run_number)
          # — a release whose triple rises while the build number does not
          # lights the in-app row and then has Sparkle report "up to date": a
          # permanently dead affordance.
          # Enforce a strictly increasing build against the currently
          # published appcast. 404 = first release / earlier appcasts skipped
          # as unverifiable (nothing to compare); any OTHER fetch failure or
          # an unparseable appcast FAILS the build — treating it like the 404
          # case would silently disable this guard exactly when it matters.
          APPCAST_URL="https://github.com/antgrid-ai/antgrid-releases/releases/latest/download/appcast.xml"
          HTTP_CODE="$(curl -sSL --retry 3 -o prev-appcast.xml -w '%{http_code}' "$APPCAST_URL")" || HTTP_CODE=000
          if [ "$HTTP_CODE" = "200" ]; then
            # Bind both reads to the SAME first <item> via xmllint (already a
            # dependency of this step) — two independent line-oriented scrapes
            # could pair values from different items once the feed carries
            # version history, silently disarming the guard.
            PREV_BUILD="$(xmllint --xpath 'string(//item[1]/*[local-name()="version"])' prev-appcast.xml 2>/dev/null || true)"
            PREV_VERSION="$(xmllint --xpath 'string(//item[1]/*[local-name()="shortVersionString"])' prev-appcast.xml 2>/dev/null || true)"
            case "$PREV_BUILD" in
              ''|*[!0-9]*)
                echo "::error::published appcast fetched but its sparkle:version is missing or non-numeric — refusing to skip the monotonic +build guard. Inspect $APPCAST_URL."
                exit 1
                ;;
            esac
            # Re-running THIS tag's workflow (retry after a flaky publish,
            # refreshed notarization) sees its own earlier appcast at latest —
            # that is idempotent regeneration, not a version regression. The
            # identity check reads shortVersionString (a field this step
            # writes, and the `version` job derives both it and the tag from
            # one string) rather than scraping the tag out of the enclosure
            # URL, whose shape (host, asset name) this guard has no business
            # pinning.
            if [ "$PREV_VERSION" != "$VERSION" ] && [ "$BUILD" -le "$PREV_BUILD" ]; then
              echo "::error::build number ($BUILD) must exceed the published appcast's sparkle:version ($PREV_BUILD) — the run counter went backwards; re-run from a newer workflow run."
              exit 1
            fi
          elif [ "$HTTP_CODE" != "404" ]; then
            echo "::error::could not fetch the published appcast (HTTP $HTTP_CODE) — refusing to skip the monotonic +build guard."
            exit 1
          fi
          if [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/sparkle.tar.xz" \
              "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_TOOLS_VERSION/Sparkle-$SPARKLE_TOOLS_VERSION.tar.xz"
            mkdir -p "$RUNNER_TEMP/sparkle"
            tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
            # sign_update emits the full attribute pair: sparkle:edSignature="..." length="..."
            ENCLOSURE_ATTRS="$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - antgrid-macos.dmg)"
          else
            ENCLOSURE_ATTRS="length=\"$(stat -f%z antgrid-macos.dmg)\""
          fi
          # minimumSystemVersion comes from the built app itself (Flutter sets
          # LSMinimumSystemVersion from MACOSX_DEPLOYMENT_TARGET) — a value
          # hardcoded here would drift the day the Xcode target moves, and
          # Sparkle would then offer the update to Macs whose OS refuses to
          # launch the new app. PlistBuddy failing (key gone) fails the step.
          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' \
            "app/build/macos/Build/Products/$DEST/antgrid.app/Contents/Info.plist")"
          [ -n "$MIN_OS" ]
          cat > appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
          <channel>
          <title>Antgrid</title>
          <item>
          <title>Antgrid ${TAG}</title>
          <sparkle:version>${BUILD}</sparkle:version>
          <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
          <sparkle:minimumSystemVersion>${MIN_OS}</sparkle:minimumSystemVersion>
          <sparkle:releaseNotesLink>https://github.com/antgrid-ai/antgrid-releases/releases/tag/${TAG}</sparkle:releaseNotesLink>
          <enclosure url="https://github.com/antgrid-ai/antgrid-releases/releases/download/${TAG}/antgrid-macos.dmg" ${ENCLOSURE_ATTRS} type="application/octet-stream"/>
          </item>
          </channel>
          </rss>
          XML
          # The feed ships straight to installed apps with no other check —
          # a malformed sign_update output or an odd tag must fail here, not
          # brick every install's update check until the next release.
          xmllint --noout appcast.xml

      - uses: actions/upload-artifact@v7
        # Exactly "the generate step ran" — no re-derived gate to keep in sync.
        if: ${{ steps.appcast.outcome == 'success' }}
        with:
          name: antgrid-appcast
          path: appcast.xml
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: ${{ always() && steps.build.outcome == 'success' }}
        with:
          name: antgrid-macos-${{ env.BUILD_MODE }}
          path: antgrid-macos.dmg
          if-no-files-found: error

  windows:
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'both' || inputs.platform == 'windows' }}
    needs: [version]
    runs-on: windows-latest
    # ~30 min typical; windows bills at 2x.
    timeout-minutes: 75
    env:
      BUILD_MODE: ${{ inputs.build_mode || 'release' }}
      DEST: ${{ (inputs.build_mode == '' || inputs.build_mode == 'release') && 'Release' || inputs.build_mode == 'profile' && 'Profile' || 'Debug' }}
      # Microsoft Store publish gate — lifted to env so the publish steps' `if`
      # can read them (secrets aren't readable in a step-level `if`). MSSTORE_APP_ID
      # is a repo *variable* (vars), not a secret — it's the public Store product
      # id, e.g. get it from `msstore apps list`. Leave any unset to keep the Store
      # publish inert; the MSIX artifact is still built for manual upload.
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_APP_ID: ${{ vars.MSSTORE_APP_ID }}
    steps:
      - uses: actions/checkout@v7

      # `cache: true` is intentionally absent — it caches the SDK, not just pub,
      # and that is a losing trade against the 10 GB budget (see FLUTTER_VERSION
      # above). The pub cache below is kept explicitly.

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          # Deliberately NO restore-keys prefix (unlike setup-android's copy):
          # actions/cache re-saves the directory as it stands, so a partial
          # restore compounds into a superset and bun never prunes the versions
          # a lockfile bump dropped.
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # The half of flutter-action's caching that is worth its bytes. Flutter
      # puts PUB_CACHE at %LOCALAPPDATA%\Pub\Cache on Windows and ~/.pub-cache
      # everywhere else; both are the SDK's own defaults, so this stays correct
      # whether or not flutter-action exports PUB_CACHE itself.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/Pub/Cache' || '~/.pub-cache' }}
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Install JS workspace deps
        # --ignore-scripts skips the root/web postinstall (Prisma client codegen
        # for the web service) — the desktop build never touches Postgres or web.
        run: bun install --ignore-scripts

      - name: Build bridge (Windows x64 binary)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force bridge/dist | Out-Null
          bun build bridge/src/index.ts --compile --target bun-windows-x64 --outfile bridge/dist/antgrid-bridge.exe --define 'process.env.LICENSE_API_URL="${{ env.LICENSE_API_URL }}"' --define 'process.env.ANTGRID_BRIDGE_COMPILED="1"'

      - name: Smoke test compiled bridge hook
        shell: pwsh
        run: bun run bridge/scripts/smoke-hook-binary.ts bridge/dist/antgrid-bridge.exe

      - name: Build Windows app
        id: build
        working-directory: app
        run: flutter build windows --${{ env.BUILD_MODE }} --build-name=${{ needs.version.outputs.build_name }} --build-number=${{ github.run_number }} --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} --dart-define=APP_VERSION=${{ needs.version.outputs.name }} --dart-define=GIT_SHA=${{ needs.version.outputs.sha }} --dart-define=BUILD_TIME=${{ needs.version.outputs.built }}

      - name: Copy bridge into output folder
        if: ${{ steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          Copy-Item bridge/dist/antgrid-bridge.exe `
            "app/build/windows/x64/runner/$env:DEST/antgrid-bridge.exe"

      # Microsoft Store package (MSIX) — the Windows distribution package, for
      # manual upload to Partner Center (and auto-publish below on a v* tag). The
      # Store signs the package itself, so this path needs no code-signing cert.
      # Release-only: the Store rejects debug/profile packages, so this is skipped
      # for those dispatch modes (and always runs on a v* tag, which is release).
      # Identity values
      # (identity_name/publisher/publisher_display_name) live in app/pubspec.yaml's
      # msix_config and MUST match Partner Center.
      #   --build-windows false: package the folder we already built above (with the
      #     bridge copied in). Letting msix re-run `flutter build windows` would
      #     drop antgrid-bridge.exe.
      # This is msix:build → patch → msix:pack rather than one msix:create because
      # the generated manifest declares only the Flutter app, and Windows refuses an
      # external CreateProcess on a packaged binary no <Application> declares — which
      # leaves every agent hook dead in the field. See scripts/patch-msix-manifest.ps1.
      # NOTE: this MSIX is NOT attached to the public GitHub Release — Windows ships
      # through the Microsoft Store only; the publish job carries just macOS + Linux.
      - name: Build MSIX files (Microsoft Store)
        if: ${{ env.BUILD_MODE == 'release' && steps.build.outcome == 'success' }}
        shell: pwsh
        working-directory: app
        run: dart run msix:build --store --build-windows false --version ${{ needs.version.outputs.msix }} --output-path "$env:GITHUB_WORKSPACE" --output-name antgrid-store

      - name: Declare bridge as a launchable Application
        if: ${{ env.BUILD_MODE == 'release' && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/patch-msix-manifest.ps1 -ManifestPath "app/build/windows/x64/runner/$env:DEST/AppxManifest.xml"

      - name: Pack MSIX (Microsoft Store)
        if: ${{ env.BUILD_MODE == 'release' && steps.build.outcome == 'success' }}
        shell: pwsh
        working-directory: app
        run: dart run msix:pack --store --build-windows false --version ${{ needs.version.outputs.msix }} --output-path "$env:GITHUB_WORKSPACE" --output-name antgrid-store

      - name: Verify MSIX protocol activation
        if: ${{ env.BUILD_MODE == 'release' && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/verify-msix-protocol.ps1 -Path antgrid-store.msix -Protocol antgrid

      - name: Verify bridge is launchable from the package
        if: ${{ env.BUILD_MODE == 'release' && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/verify-msix-executables.ps1 -Path antgrid-store.msix -Executable antgrid-bridge.exe

      - uses: actions/upload-artifact@v7
        if: ${{ env.BUILD_MODE == 'release' && steps.build.outcome == 'success' }}
        with:
          name: antgrid-windows-store
          path: antgrid-store.msix
          if-no-files-found: error

      # Publish the Store MSIX to Microsoft Store via the Store Developer CLI.
      # Fires ONLY on a v* tag (a deliberate release) AND only once the Store API
      # secrets + app id are configured — otherwise skipped, so normal tag builds
      # keep working before Store automation is set up. Requirements Microsoft
      # imposes on this path:
      #   - The app must already have ONE manual submission LIVE in the Store; the
      #     API can only *update* an existing live app, not create the first one.
      #   - GitHub-Actions Store updates currently work for FREE products only.
      #     Antgrid is listed Free (billed externally via Paddle), so it qualifies.
      # This only *uploads* the antgrid-store.msix already built above (with the
      # bridge bundled) — msstore does not rebuild it.
      # Secrets (repo Settings → Secrets and variables → Actions):
      #   MSSTORE_TENANT_ID / MSSTORE_CLIENT_ID / MSSTORE_CLIENT_SECRET /
      #   MSSTORE_SELLER_ID  (secrets)   +   MSSTORE_APP_ID (variable)
      # Entra client secrets expire, and these steps only run on a tag push or a
      # release dispatch — dispatch store-smoke.yml to check the credentials
      # without cutting a release. The event_name guard matters: a plain
      # artifact-only dispatch launched from a tag ref must not reach the Store.
      - name: Configure Microsoft Store CLI
        if: ${{ ((github.event_name == 'push' && github.ref_type == 'tag') || inputs.release) && env.MSSTORE_CLIENT_ID != '' && env.MSSTORE_APP_ID != '' && steps.build.outcome == 'success' }}
        uses: microsoft/microsoft-store-apppublisher@v1.3

      - name: Publish to Microsoft Store
        if: ${{ ((github.event_name == 'push' && github.ref_type == 'tag') || inputs.release) && env.MSSTORE_CLIENT_ID != '' && env.MSSTORE_APP_ID != '' && steps.build.outcome == 'success' }}
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          msstore reconfigure `
            --tenantId $env:MSSTORE_TENANT_ID `
            --sellerId $env:MSSTORE_SELLER_ID `
            --clientId $env:MSSTORE_CLIENT_ID `
            --clientSecret $env:MSSTORE_CLIENT_SECRET
          msstore publish "$env:GITHUB_WORKSPACE/antgrid-store.msix" -id $env:MSSTORE_APP_ID

  linux:
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_MODE: ${{ inputs.build_mode || 'release' }}
      # Flutter's Linux product folder is the LOWERCASE mode (release/profile/
      # debug), unlike the capitalized macOS/Windows DEST — so BUILD_MODE names
      # the bundle path directly and no DEST computation is needed here.
    steps:
      - uses: actions/checkout@v7

      # `cache: true` is intentionally absent — it caches the SDK, not just pub,
      # and that is a losing trade against the 10 GB budget (see FLUTTER_VERSION
      # above). The pub cache below is kept explicitly.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          # Deliberately NO restore-keys prefix (unlike setup-android's copy):
          # actions/cache re-saves the directory as it stands, so a partial
          # restore compounds into a superset and bun never prunes the versions
          # a lockfile bump dropped.
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # The half of flutter-action's caching that is worth its bytes. Flutter
      # puts PUB_CACHE at %LOCALAPPDATA%\Pub\Cache on Windows and ~/.pub-cache
      # everywhere else; both are the SDK's own defaults, so this stays correct
      # whether or not flutter-action exports PUB_CACHE itself.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/Pub/Cache' || '~/.pub-cache' }}
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.lock') }}

      # Flutter's Linux desktop toolchain + this app's plugin deps:
      #   - ninja/gtk/pkg-config/clang: the base `flutter build linux` toolchain.
      #   - libwebkit2gtk-4.1: the WebKitGTK engine webview_all_linux embeds for
      #     the preview webview (via GtkOverlay; see linux/runner/my_application.cc).
      #     This IS in the noble repos, unlike the WPE stack inappwebview needed.
      #   - libsecret-1: flutter_secure_storage_linux backing store.
      #   - libayatana-appindicator3: tray/indicator support pulled by the GTK shell.
      #   - libcurl4-openssl-dev: sentry_flutter's bundled sentry-native crash
      #     backend find_package(CURL)s its HTTP transport on Linux.
      #   - libfuse2: lets the downloaded appimagetool run (it is itself an AppImage).
      #   - zsync: provides zsyncmake — appimagetool only emits the .zsync
      #     delta-update control file when it finds zsyncmake on PATH.
      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libgtk-3-dev pkg-config clang cmake \
            libwebkit2gtk-4.1-dev \
            libsecret-1-dev libayatana-appindicator3-dev \
            libcurl4-openssl-dev libfuse2 zsync

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Install JS workspace deps
        # --ignore-scripts skips the root/web postinstall (Prisma client codegen
        # for the web service) — the desktop build never touches Postgres or web.
        run: bun install --ignore-scripts

      - name: Build bridge (Linux x64 binary)
        run: |
          set -euo pipefail
          mkdir -p bridge/dist
          bun build bridge/src/index.ts --compile \
            --target bun-linux-x64 \
            --outfile bridge/dist/antgrid-bridge \
            --define 'process.env.LICENSE_API_URL="${{ env.LICENSE_API_URL }}"' \
            --define 'process.env.ANTGRID_BRIDGE_COMPILED="1"'

      - name: Smoke test compiled bridge hook
        run: bun run bridge/scripts/smoke-hook-binary.ts bridge/dist/antgrid-bridge

      - name: Build Linux app
        id: build
        working-directory: app
        run: |
          flutter build linux --${{ env.BUILD_MODE }} \
            --build-name=${{ needs.version.outputs.build_name }} \
            --build-number=${{ github.run_number }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=APP_VERSION=${{ needs.version.outputs.name }} \
            --dart-define=GIT_SHA=${{ needs.version.outputs.sha }} \
            --dart-define=BUILD_TIME=${{ needs.version.outputs.built }}

      - name: Copy bridge into the app bundle
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          BUNDLE="app/build/linux/x64/$BUILD_MODE/bundle"
          cp bridge/dist/antgrid-bridge "$BUNDLE/antgrid-bridge"
          chmod +x "$BUNDLE/antgrid-bridge"

      # Wrap the bundle in a portable AppImage (double-click to run, no install).
      # The AppImage carries the whole Flutter bundle under usr/bin so the exe,
      # its data/ folder, bundled lib/ (rpath $ORIGIN/lib), and antgrid-bridge
      # sibling all resolve exactly as they do in a plain `flutter run`. GTK and
      # webkit2gtk are NOT bundled — they are expected on the host (documented on
      # the download page), matching how distro apps rely on the system GTK.
      - name: Package AppImage
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          BUNDLE="app/build/linux/x64/$BUILD_MODE/bundle"
          APPDIR="$RUNNER_TEMP/AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r "$BUNDLE"/. "$APPDIR/usr/bin/"
          cp app/linux/packaging/antgrid.desktop "$APPDIR/antgrid.desktop"
          cp app/linux/packaging/antgrid.png "$APPDIR/antgrid.png"
          cat > "$APPDIR/AppRun" <<'SH'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/antgrid" "$@"
          SH
          chmod +x "$APPDIR/AppRun"

          TOOL="$RUNNER_TEMP/appimagetool.AppImage"
          curl -fsSL -o "$TOOL" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$TOOL"
          # --appimage-extract-and-run avoids needing FUSE mounted for the tool.
          # -u embeds AppImageUpdate-style update information in the runtime's
          # .upd_info ELF section and (via zsyncmake) emits the .zsync control
          # file next to the output. No in-app consumer ships yet — embedding
          # from day one means every install out there is already
          # delta-updatable when one does. The zsync asset name is as
          # load-bearing as the AppImage's own: installed apps resolve it by
          # exact match against releases/latest.
          UPDINFO="gh-releases-zsync|antgrid-ai|antgrid-releases|latest|antgrid-linux.AppImage.zsync"
          ARCH=x86_64 "$TOOL" --appimage-extract-and-run \
            -u "$UPDINFO" "$APPDIR" antgrid-linux.AppImage
          # appimagetool silently skips the .zsync when zsyncmake is missing —
          # fail here rather than publish a release that breaks delta updates.
          test -f antgrid-linux.AppImage.zsync

      - uses: actions/upload-artifact@v7
        if: ${{ always() && steps.build.outcome == 'success' }}
        with:
          name: antgrid-linux-${{ env.BUILD_MODE }}
          path: |
            antgrid-linux.AppImage
            antgrid-linux.AppImage.zsync
          if-no-files-found: error

  # Tag pushes only: attach the macOS + Linux installers to a GitHub Release on
  # the PUBLIC antgrid-releases repo (Windows ships via the Microsoft Store, not a
  # direct download, so it is intentionally absent here and not a dependency —
  # a Store-publish hiccup must not block the mac/linux release). RELEASES_TOKEN is
  # a fine-grained PAT scoped to that repo (contents: read/write) — GITHUB_TOKEN
  # cannot write cross-repo.
  publish:
    # Publishing needs a tag PUSH or an explicit release dispatch. Checking
    # ref_type alone would also fire for an artifact-only dispatch launched from
    # a tag ref, which is how you rebuild an old release without republishing it.
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || inputs.release }}
    needs: [version, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: antgrid-*
          merge-multiple: true

      - name: Create release on antgrid-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
          BUILT: ${{ needs.version.outputs.built }}
        run: |
          set -euo pipefail
          # A pre-release tag (v1.1.0-beta.1) must never move releases/latest —
          # the site's stable download URLs point there.
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # appcast.xml is absent when the macos job skipped it (unsigned
          # build). Publishing a STABLE release without it is only safe while
          # no installed app polls the feed yet: once one appcast-bearing
          # release exists, a stable release without one would 404
          # releases/latest/download/appcast.xml for every installed app —
          # fail instead. Prerelease tags never move `latest`, so they may
          # always publish without an appcast. The probe fails CLOSED like
          # its sibling in the macos job: only a definitive 404 proves nobody
          # polls the feed yet — treating a transient error (or a redirect
          # target rejecting the request) as 404 would ship the fleet-wide
          # feed breakage this guard exists to prevent.
          if [ ! -f appcast.xml ] && [ -z "$prerelease" ]; then
            APPCAST_URL="https://github.com/antgrid-ai/antgrid-releases/releases/latest/download/appcast.xml"
            HTTP_CODE="$(curl -sSL --retry 3 -o /dev/null -w '%{http_code}' "$APPCAST_URL")" || HTTP_CODE=000
            if [ "$HTTP_CODE" = "200" ]; then
              echo "::error::installed apps already poll an appcast, but this release has none (unsigned build?) — publishing would break the update feed."
              exit 1
            elif [ "$HTTP_CODE" != "404" ]; then
              echo "::error::could not check for a published appcast (HTTP $HTTP_CODE) — refusing to risk breaking the update feed."
              exit 1
            fi
          fi
          assets="antgrid-macos.dmg antgrid-linux.AppImage antgrid-linux.AppImage.zsync"
          [ -f appcast.xml ] && assets="$assets appcast.xml"
          gh release create "$TAG" \
            --repo antgrid-ai/antgrid-releases \
            --title "Antgrid $TAG" \
            --notes "Desktop builds for Antgrid $TAG.

          - **macOS** (antgrid-macos.dmg): signed and notarized. Open the .dmg and drag Antgrid to Applications.
          - **Windows**: install from the [Microsoft Store](https://apps.microsoft.com/detail/9N0P7ZRL4D9W).
          - **Linux** (antgrid-linux.AppImage): \`chmod +x antgrid-linux.AppImage\` then run it. Needs GTK 3 and WebKit2GTK on the host (\`libgtk-3-0\`, \`libwebkit2gtk-4.1-0\`, \`libsecret-1-0\`).

          Built from \`$SHA\` at $BUILT." \
            $prerelease \
            $assets
