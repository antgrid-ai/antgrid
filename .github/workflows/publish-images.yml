name: Publish images — relay + web (GHCR)

# Builds the relay and web images and pushes them to GHCR. It does NOT deploy.
#
# The rollout half of this pipeline lives in the private antgrid-ai/antgrid-ops
# repo. This repo is public and accepts PRs from strangers; the blue-green flip
# needs an SSH key to the production VM. Splitting at the registry keeps every
# deploy credential out of reach — the only permission needed here is
# packages:write against the org's own GHCR, via the ephemeral GITHUB_TOKEN.
#
# Branch -> moving tag:
#   main         -> :prod
#   development  -> :staging
# Every push also publishes an immutable :<short-sha>. Ops rolls out the moving
# tag by default and pins a short SHA to roll back.
#
# The rollout files this used to sit beside (`deploy/`, `infra/`) no longer exist
# here at all — they live only in the ops repo. Nothing in this repository can
# reach a server; the furthest it goes is a tag in the registry.

on:
  push:
    branches: [main, development]
    paths:
      - 'relay/**'
      - 'web/**'
      # Both Dockerfiles COPY packages/antgrid-wire/src, so a wire-only commit
      # changes what ships. Omitting it leaves the moving tag on an image built
      # from the old wire source and publishes no :<sha> for the commit ops
      # would pin to roll back.
      - 'packages/**'
      - '.dockerignore'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

# Serialized on the moving tag rather than the ref: every ref that is not main
# resolves to :staging, so keying on ref_name would let two refs push the same
# tag concurrently and leave whichever happened to finish last.
concurrency:
  group: publish-images-${{ github.ref_name == 'main' && 'prod' || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Both images are independent — build them concurrently via a matrix.
  build:
    # Only the repo that owns the GHCR packages publishes. The image path is
    # derived from the OWNER, not the repo name, so a second repo in this org
    # would push to the very tags the ops rollout pulls.
    if: vars.RELEASE_REPO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        service: [web, relay]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derived, never hardcoded: GHCR packages are org-scoped and do NOT follow
      # a repo transfer, so a literal owner goes stale the moment the repo moves
      # and every push 403s against an org this token has no write on. Lowercased
      # because GHCR rejects any uppercase in the path and GitHub returns the
      # owner case-preserved — a fork owned by a mixed-case account otherwise
      # fails on its first push.
      - id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Short SHA = the immutable tag a rollout pins to. The env name is a
      # per-environment moving tag — kept separate so main and development never
      # clobber each other's "latest". Only the two protected branches get one:
      # workflow_dispatch accepts any ref, and since ops rolls out the moving tag
      # by default an unguarded dispatch would put unmerged code into staging
      # from a repo that shows no sign of having done so.
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: envname
        run: |
          case "$GITHUB_REF_NAME" in
            main)        echo "env=prod" >> "$GITHUB_OUTPUT" ;;
            development) echo "env=staging" >> "$GITHUB_OUTPUT" ;;
            *)           echo "env=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/antgrid-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ steps.envname.outputs.env && format('ghcr.io/{0}/antgrid-{1}:{2}', steps.owner.outputs.owner, matrix.service, steps.envname.outputs.env) || '' }}
          # Scoped per service, not per environment: main and development build
          # the same Dockerfile from the same lockfile, and splitting the scope
          # leaves the rarely-pushed prod half cold against GHA's 7-day eviction.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # The rollout runs in a different repo and cannot read this job's outputs,
      # so print the tag an operator feeds to antgrid-ops rather than leaving
      # them to derive it from the commit SHA by hand.
      - name: Summarise
        run: |
          echo "antgrid-${{ matrix.service }} → ${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.envname.outputs.env }}" ]; then
            echo "  also tagged ${{ steps.envname.outputs.env }}" >> "$GITHUB_STEP_SUMMARY"
          fi
