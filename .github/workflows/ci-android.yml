name: CI — android

# PR/main verification for the Flutter app: analyze (app + the first-party Dart
# packages) + test, plus a release AAB build gated on 16 KB ELF alignment. This
# is the ONLY Android job on a PR — the Play Store publish (deploy-android.yml)
# runs nightly and never on PRs, so the toolchain is set up once per PR, not
# twice. Shared setup lives in .github/actions/setup-android.
#
# The AAB build is half the wall-clock of this workflow and is skipped on PRs
# that leave the native surface alone (see the `native` step). It stays
# unconditional on push to main: deploy-android.yml no longer fires there, so
# this is the only thing standing between main and an unverified release build.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'packages/**'
      - '.github/workflows/ci-android.yml'
      - '.github/actions/setup-android/action.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packages/**'
      - '.github/workflows/ci-android.yml'
      - '.github/actions/setup-android/action.yml'

# Newer pushes to the same PR/branch supersede in-flight runs.
concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Where setup-android symlinks the NDK, and where the alignment gate below
      # resolves llvm-readelf from.
      ANDROID_NDK_HOME: ${{ github.workspace }}/ndk-r28
    steps:
      # Full history so the native-surface diff below can reach the PR base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Splits the release build in two. The 4-ABI AAB costs ~11 of this
      # workflow's ~23 minutes, and most of that is Rust and bundle packaging
      # that only the paths below can affect — so a Dart-only PR builds a
      # single-ABI release APK instead (see the two build steps). That keeps the
      # part that DOES depend on app/lib and packages/ — Dart AOT via
      # gen_snapshot, tree-shaking, R8 and manifest merge, none of which
      # `flutter test` exercises because it runs on the JIT VM — while dropping
      # three ABIs' worth of native compilation nothing in the diff can reach.
      #
      # Anything that is not a pull_request — push to main above — always builds
      # the full AAB; so does an unreadable base, since a skipped gate must never
      # be the reason a release build went unverified.
      - name: Does this change touch the native surface?
        id: native
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          if [ "${{ github.event_name }}" != pull_request ] || [ -z "$base" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$base" HEAD -- \
               app/android app/pubspec.yaml app/pubspec.lock \
               .github/actions/setup-android .github/workflows/ci-android.yml; then
            echo "Native surface untouched — skipping the release AAB build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The release AAB builds super_native_extensions (Rust) for 4 ABIs plus
      # Flutter/pdfium .so files; native-lib stripping exhausted the runner's
      # ~14 GB disk ("No space left on device"). Reclaim preinstalled toolchains
      # this build never uses — deliberately NOT touching the Android SDK/NDK,
      # Java, or the Flutter toolcache (hostedtoolcache) that setup-android needs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          docker image ls -aq | xargs -r docker rmi -f || true
          df -h /

      - uses: ./.github/actions/setup-android

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      # `flutter analyze` only walks the package it runs in — a path dependency
      # is type-checked as consumed, never analyzed itself. So this workflow
      # triggers on `packages/**` while nothing here reads it. Analyze the
      # first-party Dart packages explicitly.
      - name: Analyze Dart packages
        run: |
          fail=0
          for pkg in antgrid_relay_client antgrid_eval_client; do
            echo "::group::analyze $pkg"
            # Subshell so the cd can't leak into the next iteration. Each package
            # needs its OWN pub get — app's resolves into app/.dart_tool only.
            ( cd "packages/$pkg" && dart pub get && dart analyze ) || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Flutter test
        working-directory: app
        run: flutter test

      # The cheap half of the split: no native input moved, so one ABI proves
      # the release toolchain as well as four would. 16 KB alignment is NOT
      # checked here — the libs are the prebuilt ones this diff cannot touch.
      - name: Build release APK (arm64 only)
        if: steps.native.outputs.changed != 'true'
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Build release AAB
        if: steps.native.outputs.changed == 'true'
        working-directory: app
        run: flutter build appbundle --release

      # Gate the build: fail CI if any 64-bit lib regresses below 16 KB
      # alignment — e.g. a portable_pty repoint onto a prebuilt linked without
      # the max-page-size flags. 32-bit armeabi-v7a is exempt: 16 KB pages are a
      # 64-bit-only feature.
      - name: Verify 16 KB alignment
        if: steps.native.outputs.changed == 'true'
        run: |
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          unzip -o app/build/app/outputs/bundle/release/app-release.aab 'base/lib/*/*.so' -d /tmp/aab
          fail=0
          for abi in arm64-v8a x86_64; do
            for so in /tmp/aab/base/lib/$abi/*.so; do
              align=$("$READELF" -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | tail -1)
              if [ "$((align))" -lt 16384 ]; then
                echo "MISALIGNED: $abi/$(basename "$so") ($align)"; fail=1
              fi
            done
          done
          [ "$fail" = 0 ] && echo "All 64-bit libs >= 16 KB alignment ✓"
          exit $fail

      - uses: actions/upload-artifact@v7
        if: steps.native.outputs.changed == 'true'
        with:
          name: app-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
