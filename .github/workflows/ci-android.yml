name: CI — android

# PR/main verification for the Flutter app: analyze (app + the first-party Dart
# packages) + test, plus a release AAB build gated on 16 KB ELF alignment. This
# is the ONLY Android job on a PR — the Play Store publish (deploy-android.yml)
# runs nightly and never on PRs, so the toolchain is set up once per PR, not
# twice. Shared setup lives in .github/actions/setup-android.
#
# The AAB build is half the wall-clock of this workflow, and only the runs that
# can change its outcome pay for it (see the `release_build` step): a PR into
# main, which IS the release candidate, and any diff that reaches the native
# surface. A Dart-only PR into development runs analyze and test alone. The
# build stays unconditional on push to main: deploy-android.yml no longer fires
# there, so this is the last thing standing between main and an unverified
# release build.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'packages/**'
      - '.github/workflows/ci-android.yml'
      - '.github/actions/setup-android/action.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packages/**'
      - '.github/workflows/ci-android.yml'
      - '.github/actions/setup-android/action.yml'

# Newer pushes to the same PR/branch supersede in-flight runs.
concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Where setup-android symlinks the NDK, and where the alignment gate below
      # resolves llvm-readelf from.
      ANDROID_NDK_HOME: ${{ github.workspace }}/ndk-r28
    steps:
      # Full history so the native-surface diff below can reach the PR base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Decides whether this run pays for the release build. The 4-ABI AAB
      # costs ~11 of this workflow's ~23 minutes, and what it proves — Dart AOT
      # via gen_snapshot, tree-shaking, R8 and manifest merge, none of which
      # `flutter test` reaches because it runs on the JIT VM — is re-proved on
      # the way into main before any of it can ship. So a Dart-only PR into
      # development skips it and answers in roughly half the time.
      #
      # It runs for: a PR into main, any diff touching the native surface,
      # anything that is not a pull_request (push to main above), and any case
      # this step cannot resolve — a gate that gave up must never be the reason
      # a release build went unverified.
      - name: Does this run need the release build?
        id: release_build
        run: |
          set -euo pipefail
          # -f disables globbing so NATIVE_PATHS word-splits into pathspecs git
          # matches itself, instead of bash first expanding them against the
          # workspace. Nothing below is a glob today; this is what keeps adding
          # one later from silently narrowing the gate.
          set -f
          NATIVE_PATHS='app/android app/pubspec.yaml app/pubspec.lock
            .github/actions/setup-android .github/workflows/ci-android.yml'

          full() { echo "$1 — building the full AAB."; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; }

          [ "${GITHUB_EVENT_NAME}" = pull_request ] || full "Not a pull request"
          [ -n "${GITHUB_BASE_REF:-}" ] || full "Event carries no base ref"

          # A PR into main is the release candidate, and the ruleset on main
          # admits no other way in (pull_request + non_fast_forward). GitHub
          # builds the MERGE commit for a pull_request event, so this is the
          # last look at the exact tree that becomes main — and the reason a
          # development PR may skip the build without shipping it unverified.
          [ "${GITHUB_BASE_REF}" != main ] || full "Pull request targets main"

          # The fork point, deliberately NOT github.event.pull_request.base.sha:
          # that is the base tip recorded when the PR was OPENED and it never
          # advances, so diffing from it also picks up everything merged into the
          # base branch since. One commit touching a path above and every PR open
          # at the time builds the full AAB for the rest of its life — which is
          # exactly what this gate shipped doing.
          git rev-parse --verify --quiet "origin/${GITHUB_BASE_REF}^{commit}" >/dev/null \
            || git fetch --quiet origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}" \
            || full "Cannot reach origin/${GITHUB_BASE_REF}"
          base=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD) \
            || full "No merge base with origin/${GITHUB_BASE_REF}"
          echo "Fork point: ${base}"

          touched=$(git diff --name-only "$base" HEAD -- $NATIVE_PATHS)
          if [ -z "$touched" ]; then
            echo "Native surface untouched on a development PR — analyze and test only."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "$touched" | awk 'NR<=20'
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # The release AAB builds super_native_extensions (Rust) for 4 ABIs plus
      # Flutter/pdfium .so files; native-lib stripping exhausted the runner's
      # ~14 GB disk ("No space left on device"). Reclaim preinstalled toolchains
      # this build never uses — deliberately NOT touching the Android SDK/NDK,
      # Java, or the Flutter toolcache (hostedtoolcache) that setup-android needs.
      - name: Free disk space
        if: steps.release_build.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          docker image ls -aq | xargs -r docker rmi -f || true
          df -h /

      - uses: ./.github/actions/setup-android

      # The native terminal qualification test runs the bridge's authoritative
      # frame serializer and reapplies its output through Ghostty. Flutter's pub
      # resolution does not install the serializer's Bun workspace dependencies.
      - name: Install terminal qualification dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # FCM client config, when the run can see secrets. Writing it here is what
      # puts the google-services plugin — resource generation and its manifest
      # merge, which ONLY a Firebase-enabled build exercises — under PR-time
      # verification instead of discovering it in the nightly deploy.
      #
      # Tolerant, unlike deploy-android's copy: a pull_request from a fork gets
      # no secrets, and build.gradle.kts skips the plugin when the file is
      # absent, so those builds still pass — just without the Firebase half
      # compiled in. Announce which of the two builds this was; a silent
      # difference between CI and the release build is the whole reason push
      # shipped broken.
      - name: Set up FCM client config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "No GOOGLE_SERVICES_JSON_BASE64 (expected on a fork PR) — building WITHOUT the FCM plugin path."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/android/app/google-services.json
          echo "Wrote app/android/app/google-services.json — building WITH the FCM plugin path."

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      # `flutter analyze` only walks the package it runs in — a path dependency
      # is type-checked as consumed, never analyzed itself. So this workflow
      # triggers on `packages/**` while nothing here reads it. Analyze the
      # first-party Dart packages explicitly.
      - name: Analyze Dart packages
        run: |
          fail=0
          for pkg in antgrid_relay_client antgrid_eval_client; do
            echo "::group::analyze $pkg"
            # Subshell so the cd can't leak into the next iteration. Each package
            # needs its OWN pub get — app's resolves into app/.dart_tool only.
            ( cd "packages/$pkg" && dart pub get && dart analyze ) || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Flutter test
        working-directory: app
        run: flutter test

      - name: Build release AAB
        if: steps.release_build.outputs.run == 'true'
        working-directory: app
        run: flutter build appbundle --release --dart-define=SOURCE_COMMIT=${{ github.sha }}

      # Gate the build: fail CI if any 64-bit lib regresses below 16 KB
      # alignment — e.g. a portable_pty repoint onto a prebuilt linked without
      # the max-page-size flags. 32-bit armeabi-v7a is exempt: 16 KB pages are a
      # 64-bit-only feature.
      - name: Verify 16 KB alignment
        if: steps.release_build.outputs.run == 'true'
        run: |
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          unzip -o app/build/app/outputs/bundle/release/app-release.aab 'base/lib/*/*.so' -d /tmp/aab
          fail=0
          for abi in arm64-v8a x86_64; do
            for so in /tmp/aab/base/lib/$abi/*.so; do
              align=$("$READELF" -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | tail -1)
              if [ "$((align))" -lt 16384 ]; then
                echo "MISALIGNED: $abi/$(basename "$so") ($align)"; fail=1
              fi
            done
          done
          [ "$fail" = 0 ] && echo "All 64-bit libs >= 16 KB alignment ✓"
          exit $fail

      - uses: actions/upload-artifact@v7
        if: steps.release_build.outputs.run == 'true'
        with:
          name: app-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
