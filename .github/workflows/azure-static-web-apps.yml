name: Deploy marketing site (Azure SWA)

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/azure-static-web-apps.yml"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths: ["site/**", ".github/workflows/azure-static-web-apps.yml"]

permissions:
  contents: read
  pull-requests: write

# A merge fires `closed` while that PR's last `synchronize` build is often still
# running. If its Deploy lands after the close job, it re-creates the staging
# environment the close just deleted and nothing ever reaps it again. The Free
# SKU allows 3, so three such leaks wedge every later PR on "maximum number of
# staging environments". Cancelling the older run of the same PR closes the
# window; push-to-main groups separately so a production deploy is never
# cancelled by PR traffic.
concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_deploy:
    # Fork PRs are correctly denied AZURE_STATIC_WEB_APPS_API_TOKEN, so without
    # this they would fail with a red X on every contributor PR rather than being
    # skipped. Same guard on close_preview below.
    if: |
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-site-${{ hashFiles('site/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-site-
      - name: Install and build
        working-directory: site
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build
      # Cache the Chromium download keyed on the lockfile (playwright version moves
      # with it). --with-deps still installs OS apt deps on a hit, but the browser
      # binary download — the slow part — is skipped.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        working-directory: site
        run: bunx playwright install --with-deps chromium
      - name: Test
        working-directory: site
        run: bun run test
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "site/dist"
          skip_app_build: true
          skip_api_build: true

  close_preview:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Close PR preview
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
