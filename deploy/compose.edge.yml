# Edge proxy: Caddy with automatic HTTPS (Let's Encrypt).
#
# Long-lived and NOT colored — started once at bootstrap and left running:
#   docker compose -p ab-edge -f compose.edge.yml up -d
#
# Caddy terminates TLS for both app.antgrid.ai and relay.antgrid.ai (WSS
# included — Caddy v2 proxies WebSockets transparently) and reverse-proxies to
# the live color. deploy.sh rewrites ./caddy/sites/active.caddy and reloads.

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"     # required for ACME HTTP-01 challenge + HTTP->HTTPS redirect
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites:/etc/caddy/sites:ro
      - caddy_data:/data      # persisted certs — DO NOT lose this volume
      - caddy_config:/config
    networks:
      - antgrid_edge

volumes:
  caddy_data:
  caddy_config:

networks:
  antgrid_edge:
    external: true
