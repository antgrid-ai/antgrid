groups:
  - name: antgrid-iroh
    rules:
      - alert: IrohRelayMetricsUnavailable
        expr: up{job="relayserver"} == 0 or absent(up{job="relayserver"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Iroh relay metrics are unavailable
      - alert: IrohRelayUnhealthy
        expr: probe_success{job="relayserver-healthz"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Iroh relay /healthz probe is failing
