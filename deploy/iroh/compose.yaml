services:
  iroh:
    build:
      context: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    pids_limit: 128
    ports:
      - '443:443'
      - '80:80'
    environment:
      # Read by the stock binary itself (main.rs ENV_HTTP_BEARER_TOKEN); web
      # holds the same value as PEER_RELAY_ACCESS_TOKEN. Never put it in
      # relay.toml — see that file's [access.http] comment.
      IROH_RELAY_HTTP_BEARER_TOKEN: '${IROH_RELAY_HTTP_BEARER_TOKEN:?Set the token web also holds as PEER_RELAY_ACCESS_TOKEN}'
    volumes:
      - '${IROH_CONFIG_PATH:?Set an absolute protected relay config path}:/config/relay.toml:ro'
      - '${IROH_CERT_DIRECTORY:?Set an absolute TLS certificate directory}:/certs:ro'
    networks: [services]
networks:
  services:
    external: true
    name: '${ANTGRID_PRIVATE_NETWORK:?Set the existing private backend network}'
