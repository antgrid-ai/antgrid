name: antgrid
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# Local builds only. Every shipped build overrides this with --build-name /
# --build-number stamped by CI (see the `version` job in build-desktop.yml), so
# bumping this by hand changes nothing users see.
version: 1.0.6+7

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.5
  fleather: ^1.27.0
  # Direct dep even though fleather re-exports it: ComposerController encodes
  # markdown via ParchmentMarkdownCodec directly (package:parchment/codecs.dart).
  parchment: ^1.27.0
  flutter_riverpod: ^3.0.0
  antgrid_relay_client:
    path: ../packages/antgrid_relay_client
  url_launcher: ^6.3.0
  web_socket_channel: ^3.0.1
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^10.3.1
  cryptography: ^2.7.0
  uuid: ^4.5.1
  # Ghostty's VT engine in Flutter — production terminal renderer.
  # Wins decisively on TUI block-element rendering (▀ ▄ █ etc) over the
  # previous kterm-based path which required a custom geometric painter.
  ghostty_vte_flutter: ^0.1.3
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  # Preview webview. webview_flutter is the app-facing API (WebViewController/
  # WebViewWidget); webview_all federates the platform impls — official
  # webview_flutter_android/_wkwebview on mobile, its own WebView2 (Windows),
  # WKWebView (macOS) and WebKitGTK 4.1 (Linux) backends on desktop. Linux is a
  # native GtkOverlay (see linux/runner/my_application.cc) so the webview draws
  # on top of Flutter widgets over the preview rect — expected, WebKitGTK can't
  # render offscreen-to-texture.
  webview_flutter: ^4.13.1
  webview_all: ^1.2.1
  re_editor: ^0.9.0
  re_highlight: ^0.0.3
  path_provider: ^2.1.5
  iconify_flutter: ^0.0.7
  flutter_svg: ^2.2.4
  file_selector: ^1.1.0
  shared_preferences: ^2.5.5
  collection: ^1.18.0
  path: ^1.9.0
  flutter_colorpicker: ^1.1.0
  app_links: ^7.2.0
  http: ^1.2.2
  flutter_local_notifications: ^22.0.1
  markdown_widget: ^2.3.2+8
  pdfrx: ^2.4.4
  sentry_flutter: ^9.22.0
  # Fork of uxduck/push. Stock push runs the host app's main() headlessly on a
  # terminated-state push (BackgroundFlutterAppLauncher); the fork adds an
  # AndroidManifest-configurable background entrypoint so ours runs
  # pushBackgroundMain instead. See docs/superpowers/specs/
  # 2026-07-15-push-package-migration-design.md. Pinned to a SHA: upstream is
  # dormant and we do not expect to move off the fork.
  push:
    git:
      url: https://github.com/bharathm03/push.git
      ref: bf4f22f0c2763416265a02268e3b071ab1767885
  markdown: ^7.3.1
  super_clipboard: ^0.9.0
  in_app_update: ^4.2.3
  device_info_plus: ^11.5.0
  window_manager: ^0.5.2
  # macOS in-place updates via Sparkle (Windows uses the Microsoft Store
  # instead — see lib/update/). Feed: appcast.xml on antgrid-releases.
  auto_updater: ^1.0.0
  package_info_plus: ^9.0.1
  # Installed-version vs release-tag precedence in the update check —
  # already in the tree transitively, promoted so lib/update/ can import it.
  pub_semver: ^2.2.0
  # Parses the Sparkle appcast macOS detects from (lib/update/). Transitive
  # already; promoted for the same reason as pub_semver above.
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^2.0.1
  shared_preferences_platform_interface: ^2.4.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_driver:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  # Pinned <2.4.8 from before the SDK itself bumped to meta 1.18.0; no longer
  # a known conflict, but kept until re-evaluated.
  flutter_native_splash: ^2.4.6
  visibility_detector: ^0.4.0+2
  msix: ^3.18.0

# Launcher icons for platforms that force opacity. Source is a square,
# full-bleed tiled PNG (assets/icon/antgrid-icon-1024.png, rx=0) so each
# platform applies its own corner mask without double-rounding. Regenerate
# with:
#   dart run flutter_launcher_icons
# Windows is EXCLUDED: windows/runner/resources/app_icon.ico is hand-built
# (tileless dark-scheme monogram, explicit 16/24/32/48/256 layers — recipe in
# web/public/logo/README.md); a regen must not clobber it.
flutter_launcher_icons:
  image_path: "assets/icon/antgrid-icon-1024.png"
  android: "ic_launcher"
  adaptive_icon_background: "#18181B"
  adaptive_icon_foreground: "assets/icon/antgrid-icon-1024.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#18181B"
  web:
    generate: true
    image_path: "assets/icon/antgrid-icon-1024.png"
    background_color: "#18181B"
    theme_color: "#18181B"
  windows:
    generate: false
  macos:
    generate: true
    image_path: "assets/icon/antgrid-icon-1024.png"

# Cold-start splash across Android (incl. 12+) and iOS. Regenerate with:
#   dart run flutter_native_splash:create
# The general image is the full antgrid wordmark. Android 12+ needs a square
# canvas whose artwork stays inside the platform's adaptive-icon safe circle.
flutter_native_splash:
  color: "#08090A"
  image: "assets/icon/splash-mark.png"
  android_12:
    color: "#08090A"
    image: "assets/icon/android12-splash-wordmark.png"
  web: false

# Vendored fork of ghostty_vte_flutter with a `showFocusRing` constructor
# param gating upstream's hardcoded #2A83FF focus border, plus
# `showKeyboardOnInteraction`/`GhosttyTerminalSoftKeyboardController` so hosts
# can reserve taps for scroll/select and summon the mobile IME explicitly.
# Drop this override (and the vendored copy under packages/) once both ship
# upstream.
dependency_overrides:
  ghostty_vte_flutter:
    path: ../packages/ghostty_vte_flutter
  # Vendored fork of ghostty_vte 0.1.3 carrying a pure-Dart FFI fix:
  # VtRgbColor.fromNative read colors via a struct-BY-VALUE accessor that Dart
  # FFI mismarshals on macOS/iOS arm64, so every terminal color resolved to
  # black (colored text invisible; only default-fg text showed). The native
  # libghostty-vt is unchanged — the build hook still downloads the official
  # prebuilt. Drop once the fix lands upstream (kingwill101/dart_terminal).
  ghostty_vte:
    path: ../packages/ghostty_vte
  # Vendored fork of portable_pty 0.0.5 with a one-block patch so iOS honours the
  # native-assets dynamic link-mode preference (iOS simulator). See the package's
  # lib/src/hook/artifacts.dart for the why; drop once upstream fixes it.
  portable_pty:
    path: ../packages/portable_pty

# Microsoft Store packaging (MSIX). The Store signs the package itself, so no
# code-signing cert is used on this path (unlike the Inno Setup installer in
# .github/workflows/build-desktop.yml, which is Authenticode-signed for direct
# download).
msix_config:
  display_name: antgrid
  publisher_display_name: Radha AI Product
  identity_name: RadhaAIProduct.antgrid
  publisher: CN=D6BFB7D7-5E99-4B9B-B4E0-29315D52C52B
  # Local `dart run msix:create` only — CI passes --version explicitly (the
  # `version` job's msix output). Partner Center rejects a submission whose
  # package version does not strictly increase, and installed apps never see
  # such a release as an update.
  msix_version: 1.0.7.0
  # Same tileless monogram the old Inno installer + the exe/taskbar use
  # (windows/runner/resources/app_icon.ico), rendered transparent and square from
  # antgrid-icon-square.svg. trim_logo MUST stay false: the monogram's artwork is
  # portrait (tall antennae), so the msix package's default trim-then-fit-to-square
  # would crop the antenna dots and the base of the "a" on every square tile.
  logo_path: assets/icon/antgrid-store-logo.png
  trim_logo: false
  architecture: x64
  capabilities: internetClient
  protocol_activation: antgrid

