name: antgrid
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# Local builds only. Every shipped build overrides this with --build-name /
# --build-number stamped by CI (see the `version` job in build-desktop.yml), so
# bumping this by hand changes nothing users see.
version: 1.0.6+7

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.5
  fleather: ^1.27.0
  # Direct dep even though fleather re-exports it: ComposerController encodes
  # markdown via ParchmentMarkdownCodec directly (package:parchment/codecs.dart).
  parchment: ^1.27.0
  flutter_riverpod: ^3.0.0
  antgrid_relay_client:
    path: ../packages/antgrid_relay_client
  url_launcher: ^6.3.0
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^10.3.1
  cryptography: ^2.7.0
  # Native AES-GCM for the E2E transport cipher (see config/native_crypto.dart).
  # No Dart symbol outside that file references it, but removing it drops every
  # relay frame back onto the pure-Dart cipher on the UI isolate.
  cryptography_flutter: ^2.3.4
  uuid: ^4.5.1
  # Ghostty's VT engine in Flutter — production terminal renderer.
  # Wins decisively on TUI block-element rendering (▀ ▄ █ etc) over the
  # previous kterm-based path which required a custom geometric painter.
  ghostty_vte_flutter: ^0.1.3
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  # Preview webview: both the app-facing API (WebViewController/WebViewWidget)
  # and every platform impl — WebView2 (Windows), WKWebView (macOS/iOS),
  # WebKitGTK 4.1 (Linux), Android. Since 1.3.0 it vendors its own
  # `webview_platform_interface` rather than federating webview_flutter's, so
  # the two packages' WebViewControllers are unrelated classes: adding
  # webview_flutter alongside it buys nothing and mixing their types won't
  # compile. Linux draws into a native GtkOverlay (linux/runner/my_application.cc)
  # over the preview rect, on top of Flutter widgets — expected, WebKitGTK can't
  # render offscreen-to-texture.
  webview_all: ^1.3.5
  re_editor: ^0.9.0
  re_highlight: ^0.0.3
  path_provider: ^2.1.5
  iconify_flutter: ^0.0.7
  flutter_svg: ^2.2.4
  file_selector: ^1.1.0
  shared_preferences: ^2.5.5
  collection: ^1.18.0
  path: ^1.9.0
  flutter_colorpicker: ^1.1.0
  app_links: ^7.2.0
  http: ^1.2.2
  flutter_local_notifications: ^22.0.1
  markdown_widget: ^2.3.2+8
  pdfrx: ^2.4.4
  sentry_flutter: ^9.22.0
  # Fork of uxduck/push. Stock push runs the host app's main() headlessly on a
  # terminated-state push (BackgroundFlutterAppLauncher); the fork adds an
  # AndroidManifest-configurable background entrypoint so ours runs
  # pushBackgroundMain instead. See docs/superpowers/specs/
  # 2026-07-15-push-package-migration-design.md. Pinned to a SHA: upstream is
  # dormant and we do not expect to move off the fork.
  push:
    git:
      url: https://github.com/bharathm03/push.git
      ref: bf4f22f0c2763416265a02268e3b071ab1767885
  markdown: ^7.3.1
  super_clipboard: ^0.9.0
  # Drag-and-drop onto the terminal. Pure Dart: its native half is
  # super_native_extensions, already linked for super_clipboard, so this
  # adds no platform code on any of the six targets.
  super_drag_and_drop: ^0.9.1
  in_app_update: ^4.2.3
  device_info_plus: ^11.5.0
  window_manager: ^0.5.2
  # macOS in-place updates via Sparkle (Windows uses the Microsoft Store
  # instead — see lib/update/). Feed: appcast.xml on the antgrid repo releases.
  auto_updater: ^1.0.0
  package_info_plus: ^9.0.1
  # Installed-version vs release-tag precedence in the update check —
  # already in the tree transitively, promoted so lib/update/ can import it.
  pub_semver: ^2.2.0
  # Parses the Sparkle appcast macOS detects from (lib/update/). Transitive
  # already; promoted for the same reason as pub_semver above.
  xml: ^6.6.1
  # Allocator for the kernel32 job-object calls in
  # lib/launcher/windows_job_object.dart. Transitive already; promoted because
  # dart:ffi ships no allocator of its own.
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^2.0.1
  shared_preferences_platform_interface: ^2.4.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_driver:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  # Pinned <2.4.8 from before the SDK itself bumped to meta 1.18.0; no longer
  # a known conflict, but kept until re-evaluated.
  flutter_native_splash: ^2.4.6
  visibility_detector: ^0.4.0+2
  msix: ^3.18.0

# Launcher icons for platforms that force opacity. Source is a square,
# full-bleed tiled PNG (assets/icon/antgrid-icon-1024.png, rx=0) so each
# platform applies its own corner mask without double-rounding. Regenerate
# with:
#   dart run flutter_launcher_icons
# Windows is EXCLUDED: windows/runner/resources/app_icon.ico comes from
# `npm run gen:icons` instead (tiled monogram, explicit 16/24/32/48/256
# layers — see web/public/logo/README.md); a regen must not clobber it.
flutter_launcher_icons:
  image_path: "assets/icon/antgrid-icon-1024.png"
  android: "ic_launcher"
  adaptive_icon_background: "#101418"
  adaptive_icon_foreground: "assets/icon/antgrid-icon-1024.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#101418"
  web:
    generate: true
    image_path: "assets/icon/antgrid-icon-1024.png"
    background_color: "#101418"
    theme_color: "#101418"
  windows:
    generate: false
  macos:
    generate: true
    image_path: "assets/icon/antgrid-icon-1024.png"

# Cold-start splash across Android (incl. 12+) and iOS. Regenerate with:
#   dart run flutter_native_splash:create
# The general image is the horizontal lockup. Android 12+ needs a square
# canvas whose artwork stays inside the platform's adaptive-icon safe circle.
flutter_native_splash:
  color: "#08090A"
  image: "assets/icon/splash-mark.png"
  android_12:
    color: "#08090A"
    image: "assets/icon/android12-splash-wordmark.png"
  web: false

# The terminal engine and PTY layer come from a fork of kingwill101/dart_terminal
# carrying fixes upstream has not taken: an FFI colour bug, the host hooks the
# terminal view needs, and Android PTY binaries linked to pass Play's 16 KB
# page-alignment gate. What diverges and what it would take to go back:
# docs/dart-terminal-fork-release.md. `ref` is a commit SHA on purpose — the fork
# cuts no VTE release, and a branch would make every `pub get` a moving target.
dependency_overrides:
  # The fork's packages need hooks 2.x, which needs meta ^1.19.0; the Flutter SDK
  # pins 1.18.0, so solving fails outright without this.
  meta: 1.19.0
  ghostty_vte_flutter:
    git:
      url: https://github.com/antgrid-ai/dart_terminal.git
      path: pkgs/vte/ghostty_vte_flutter
      ref: 6831ba09fe9a298ecd9e1d9bdb40de141b9bfbee
  ghostty_vte:
    git:
      url: https://github.com/antgrid-ai/dart_terminal.git
      path: pkgs/vte/ghostty_vte
      ref: 6831ba09fe9a298ecd9e1d9bdb40de141b9bfbee
  portable_pty:
    git:
      url: https://github.com/antgrid-ai/dart_terminal.git
      path: pkgs/pty/portable_pty
      ref: 6831ba09fe9a298ecd9e1d9bdb40de141b9bfbee

# Microsoft Store packaging (MSIX). The Store signs the package itself, so no
# code-signing cert is used on this path (unlike the Inno Setup installer in
# .github/workflows/build-desktop.yml, which is Authenticode-signed for direct
# download).
msix_config:
  display_name: antgrid
  publisher_display_name: Radha AI Product
  identity_name: RadhaAIProduct.antgrid
  publisher: CN=D6BFB7D7-5E99-4B9B-B4E0-29315D52C52B
  # Local `dart run msix:create` only — CI passes --version explicitly (the
  # `version` job's msix output). Partner Center rejects a submission whose
  # package version does not strictly increase, and installed apps never see
  # such a release as an update.
  msix_version: 1.0.7.0
  # Same tiled monogram the old Inno installer + the exe/taskbar use
  # (windows/runner/resources/app_icon.ico), full-bleed and square, written by
  # `npm run gen:icons`. Tiled because the Store and the Start menu paint it onto
  # a background we don't pick, and the tileless mark went invisible on the light
  # ones (web/public/logo/README.md). trim_logo MUST stay false: the artwork is
  # portrait (tall antennae), so should the source ever go transparent again, the
  # msix package's default trim-then-fit-to-square would crop the antenna dots and
  # the base of the "a" on every square tile.
  logo_path: assets/icon/antgrid-store-logo.png
  trim_logo: false
  architecture: x64
  capabilities: internetClient
  protocol_activation: antgrid

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/logo/
    # OFL 1.1 requires the licence travel with the font; bundling it as an
    # asset satisfies that, and main.dart feeds it to LicenseRegistry.
    - assets/fonts/OFL.txt

  # JetBrains Mono NL ("NL" = no ligatures — the ligature build would form
  # combined glyphs across terminal cells, see AbTokens.fontMono). Medium is
  # bundled purely so the low-DPI weight bump has a real master to step to;
  # see AbTokens.bumpStrength.
  fonts:
    - family: JetBrains Mono NL
      fonts:
        - asset: assets/fonts/JetBrainsMonoNL-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMonoNL-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/JetBrainsMonoNL-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMonoNL-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/JetBrainsMonoNL-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMonoNL-BoldItalic.ttf
          weight: 700
          style: italic

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
