org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# The two flags below are managed by Flutter's project migrators
# (disable_built_in_kotlin_migration.dart / disable_new_dsl_migration.dart) and
# pin the legacy behavior ahead of upcoming default flips. KEEP THEM — they are
# not noise, and deleting them is futile: every `flutter build`/`flutter run`
# re-appends them as =false (verified). Change them only as a deliberate, tested
# migration, not casually.
#
# android.newDsl: opt out of AGP's new DSL, which only lands in AGP 9.0
#   (we are on 8.11.1) — there is nothing to adopt here yet.
# android.builtInKotlin: keep applying the Kotlin plugin explicitly
#   (settings.gradle.kts + app `id("kotlin-android")`). Flipping this to true and
#   dropping those declarations DOES build, but it only silences the *app-level*
#   KGP-deprecation warning; the dominant warning comes from upstream plugins
#   (mobile_scanner, shared_preferences_android, webview_flutter_android)
#   applying KGP themselves and persists until THEY
#   migrate — so the flip buys no clean build and adopts an experimental default
#   early. The KGP warning is emitted unconditionally by Flutter and is NOT
#   gated by these flags. Revisit when those plugins ship built-in-Kotlin support.
android.builtInKotlin=false
android.newDsl=false
